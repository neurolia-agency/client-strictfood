<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>Story — Rappel Paques</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Oswald:wght@500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/Users/dorian.gz/dev/Neurolia Agency/client-strictfood/production/posts-stories/stories/_templates/_base/base.css">
  <style>
    /* Disable all default overlays from base.css */
    .gradient-top, .gradient-bottom, .gradient-left, .accent-line, .zone-blend, .ambient-bottom, .content, .bottom-section { display: none; }

    /* ===== PHOTO — poussee vers le bas ===== */
    .photo {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 50%;
      transform: translateY(100px);
      z-index: 1;
    }

    /* ===== GRADIENT HAUT — renforce pour lisibilite texte ===== */
    .story-gradient-top {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 800px;
      background: linear-gradient(to bottom,
        rgba(20,18,16, 1.0) 0%,
        rgba(20,18,16, 0.95) 18%,
        rgba(20,18,16, 0.80) 35%,
        rgba(20,18,16, 0.45) 65%,
        transparent 100%
      );
      z-index: 2;
    }

    /* ===== GRADIENT BAS — zone tagline ===== */
    .story-gradient-bottom {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 450px;
      background: linear-gradient(to top,
        rgba(20,18,16, 0.92) 0%,
        rgba(20,18,16, 0.70) 35%,
        rgba(20,18,16, 0.35) 65%,
        transparent 100%
      );
      z-index: 2;
    }

    /* ===== ZONE TEXTE — haut centre ===== */
    .text-zone {
      position: absolute;
      top: 230px;
      left: 70px;
      right: 70px;
      z-index: 10;
      text-align: center;
    }

    .text-line-1 {
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: 80px;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: -1px;
      line-height: 1.05;
      text-shadow:
        0 0 6px rgba(0,0,0,0.9),
        0 2px 10px rgba(0,0,0,0.7),
        0 4px 30px rgba(0,0,0,0.4);
    }

    .text-line-2 {
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: 80px;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: -1px;
      line-height: 1.05;
      margin-top: 4px;
      text-shadow:
        0 0 6px rgba(0,0,0,0.9),
        0 2px 10px rgba(0,0,0,0.7),
        0 4px 30px rgba(0,0,0,0.4);
    }
    .text-line-2 .accent { color: #FABA43; }

    .text-horaires {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 36px;
      color: rgba(255,255,255,0.70);
      margin-top: 24px;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-shadow:
        0 0 4px rgba(0,0,0,0.8),
        0 2px 8px rgba(0,0,0,0.5);
    }

    /* ===== BOTTOM : tagline + logo ===== */
    .story-bottom {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      z-index: 10;
      text-align: center;
      padding: 40px 70px 80px;
    }
    .story-bottom .tagline {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 36px;
      color: #fff;
      line-height: 1.3;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }
    .story-bottom .tagline em { color: #FABA43; font-style: italic; }
    .story-bottom .logo-container { margin-top: 14px; display: flex; justify-content: center; }
    .story-bottom .logo-container img { width: 180px; height: auto; opacity: 0.80; }
  </style>
</head>
<body>

  <!-- Photo plein cadre — poussee vers le bas -->
  <img class="photo" src="/Users/dorian.gz/dev/Neurolia Agency/client-strictfood/production/posts-stories/stories/S4/samedi/story-04/brouillons/05-04-2026-brand-bun-noir-paques-nid-9x16.png" alt="">

  <!-- Gradients -->
  <div class="story-gradient-top"></div>
  <div class="story-gradient-bottom"></div>

  <!-- Zone texte — haut centre -->
  <div class="text-zone">
    <div class="text-line-1">Un week-end de Pâques</div>
    <div class="text-line-2">pas comme les <span class="accent">autres</span></div>
    <div class="text-horaires">11h-14h · 18h-22h</div>
  </div>

  <!-- Bottom : tagline only, pas de logo (doublon avec username IG) -->
  <div class="story-bottom">
    <div class="tagline">Le cheat meal <em>qui n'en est pas un</em></div>
  </div>

</body>
</html>
