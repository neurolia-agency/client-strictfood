<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>Story Educative v2 — {{TITLE}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Oswald:wght@500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../_base/base.css">
  <link rel="stylesheet" href="../_base/blocks/header-label.css">
  <link rel="stylesheet" href="../_base/blocks/hero-number.css">
  <link rel="stylesheet" href="../_base/blocks/explanation.css">
  <link rel="stylesheet" href="../_base/blocks/vs-block.css">
  <link rel="stylesheet" href="../_base/blocks/bottom-section.css">
  <style>
    /*
     * EDUCATIF v2 — Chiffre cle + explication + VS optionnel
     * Cadre rigide : positions Y fixes pour chaque zone
     * Photo BG a droite, gradients a gauche
     *
     * LIMITES DE CARACTERES :
     * TITLE             : max 45 car, 2 lignes
     * FACT_NUMBER       : max 4 car, 1 ligne
     * FACT_UNIT         : max 25 car, 1 ligne
     * EXPLANATION       : max 120 car, 3 lignes
     * VS values         : max 6 car each
     * VS_THEIRS_LABEL   : max 20 car
     * TAGLINE           : max 40 car, 1 ligne
     *
     * BLOCKS USED: header-label, hero-number, explanation, vs-block, bottom-section
     */

    /* Block configuration via custom properties */
    :root {
      --label-top: 370px;
      --label-left: 90px;
      --hero-number-top: 570px;
      --hero-number-left: 90px;
      --expl-top: 870px;
      --expl-left: 90px;
      --expl-max-width: 620px;
      --vs-top: 1100px;
      --vs-left: 70px;
    }

    .content {
      padding: 0 70px 0;
      align-items: flex-start;
      justify-content: flex-start;
    }

    /* ===== TITLE ZONE — unique to educatif ===== */
    .zone-title {
      position: absolute;
      top: 410px;
      left: 90px;
      right: 400px;
      z-index: 10;
      max-height: 130px;
      overflow: hidden;
    }

    .edu-title {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 48px;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 3px;
      line-height: 1.2;
    }
  </style>
</head>
<body class="{{MOOD_CLASS}} {{IMG_CLASS}} {{OVERLAY_CLASS}} {{GRAD_CLASS}} {{PHOTO_PRESET}} grain-medium mesh-cuivre">

  <!-- Optional background image -->
  <img class="bg-image" src="{{BG_IMAGE_PATH}}" alt="" style="display: {{SHOW_BG}}">

  <!-- Gradient overlays -->
  <div class="gradient-top"></div>
  <div class="gradient-bottom"></div>
  <div class="gradient-left"></div>
  <div class="ambient-bottom"></div>

  <!-- Decorative accent line (modern v2 with glow) -->
  <div class="accent-line-modern"></div>

  <!-- Zone blend + product hero (dual-image pattern, optional) -->
  <div class="zone-blend" style="display: {{SHOW_HERO}}"></div>
  <img class="product-hero" src="{{HERO_IMAGE_PATH}}" alt="" style="display: {{SHOW_HERO}}">

  <!-- CONTENT ZONES -->

  <!-- Header Label (block) -->
  <div class="header-label">
    <span class="label-text {{LABEL_DEPTH}}">Le savais-tu ?</span>
  </div>

  <!-- Title (template-specific) -->
  <div class="zone-title">
    <div class="edu-title {{TITLE_DEPTH}}">{{TITLE}}</div>
  </div>

  <!-- Hero Number (block) -->
  <div class="hero-number-block">
    <div class="number-value">{{FACT_NUMBER}}</div>
    <div class="number-unit">{{FACT_UNIT}}</div>
  </div>

  <!-- Explanation (block) -->
  <div class="explanation-block {{EXPL_TAPE}}">
    <p class="explanation-text {{EXPL_DEPTH}}">{{EXPLANATION}}</p>
  </div>

  <!-- VS Block (block, optional) -->
  <div class="vs-block" style="display: {{SHOW_VS}}">
    <div class="vs-item vs-ours">
      <span class="vs-label">Strict Food's</span>
      <span class="vs-value">{{VS_OURS_VALUE}}</span>
      <span class="vs-unit">{{VS_OURS_UNIT}}</span>
    </div>
    <span class="vs-separator">VS</span>
    <div class="vs-item vs-theirs">
      <span class="vs-label">{{VS_THEIRS_LABEL}}</span>
      <span class="vs-value">{{VS_THEIRS_VALUE}}</span>
      <span class="vs-unit">{{VS_THEIRS_UNIT}}</span>
    </div>
  </div>

  <!-- Bottom Section (block) -->
  <div class="bottom-section">
    <div class="tagline">{{TAGLINE}}</div>
    <div class="logo-container">
      <img src="../_base/logo.svg" alt="STRICT FOOD'S">
    </div>
  </div>

</body>
</html>
