<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>Story Annonce v2 — {{HEADLINE}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Oswald:wght@500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../_base/base.css">
  <link rel="stylesheet" href="../_base/blocks/header-label.css">
  <link rel="stylesheet" href="../_base/blocks/explanation.css">
  <link rel="stylesheet" href="../_base/blocks/bottom-section.css">
  <style>
    /*
     * ANNONCE v2 — Badge + headline + body + CTA centre
     * Cadre rigide : tout centre, positions Y fixes
     * Photo BG full-screen dimmed optionnelle
     *
     * LIMITES DE CARACTERES :
     * BADGE_TEXT         : max 20 car, 1 ligne
     * HEADLINE           : max 30 car, 2 lignes
     * BODY_TEXT          : max 120 car, 3 lignes
     * CTA_TEXT           : max 25 car, 1 ligne
     * TAGLINE            : max 40 car, 1 ligne
     *
     * BLOCKS USED: header-label (badge variant), explanation, bottom-section
     */

    /* Block configuration via custom properties */
    :root {
      --label-top: 440px;
      --label-left: 80px;
      --expl-top: 820px;
      --expl-left: 80px;
      --expl-max-width: 920px;
    }

    .content {
      padding: 0 80px;
      justify-content: flex-start;
      align-items: center;
      text-align: center;
    }

    /* ===== HEADLINE ZONE — unique to annonce ===== */
    .zone-headline {
      position: absolute;
      top: 530px;
      left: 80px; right: 80px;
      z-index: 10;
      text-align: center;
      max-height: 210px;
      overflow: hidden;
    }

    .annonce-headline {
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: 90px;
      color: #fff;
      line-height: 1.05;
      text-transform: uppercase;
    }
    .annonce-headline em {
      color: var(--accent);
      font-style: normal;
      filter: brightness(1.2);
    }

    /* ===== DIVIDER — unique to annonce ===== */
    .zone-divider {
      position: absolute;
      top: 770px;
      left: 0; right: 0;
      z-index: 10;
      display: flex;
      justify-content: center;
    }

    .divider {
      width: 80px;
      height: 4px;
      background: linear-gradient(to right, transparent, var(--accent), transparent);
      border-radius: 2px;
    }

    /* ===== CTA BUTTON — unique to annonce ===== */
    .zone-cta {
      position: absolute;
      top: 1060px;
      left: 80px; right: 80px;
      z-index: 10;
      text-align: center;
    }

    .annonce-cta {
      display: inline-block;
      padding: 22px 50px;
      border-radius: 999px;
      background: var(--accent);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 28px;
      font-weight: 700;
      color: #141210;
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    /* ===== BACKGROUND (annonce-specific) ===== */
    .annonce-bg {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: var(--img-opacity);
      filter: brightness(var(--img-brightness)) sepia(var(--img-sepia)) saturate(var(--img-saturate));
    }

    .gradient-center {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(ellipse at center, rgba(var(--bg-rgb),0.15) 0%, rgba(var(--bg-rgb),0.60) 55%, rgba(var(--bg-rgb),0.80) 80%);
      z-index: 3;
    }

    /* Override: header-label centered + badge variant */
    .header-label {
      left: 80px;
      right: 80px;
      text-align: center;
    }

    /* Override: explanation block centered */
    .explanation-block {
      left: 80px;
      right: 80px;
      max-width: none;
      text-align: center;
      max-height: 180px;
      overflow: hidden;
    }
  </style>
</head>
<body class="{{MOOD_CLASS}} {{IMG_CLASS}} {{OVERLAY_CLASS}} {{GRAD_CLASS}} {{PHOTO_PRESET}} grain-medium mesh-cuivre">

  <!-- Optional background image -->
  <img class="annonce-bg" src="{{BG_IMAGE_PATH}}" alt="" style="display: {{SHOW_BG}}">

  <!-- Gradient overlay -->
  <div class="gradient-center"></div>
  <div class="ambient-bottom"></div>

  <!-- CONTENT ZONES -->

  <!-- Badge (header-label block, badge variant) -->
  <div class="header-label label-badge">
    <span class="label-text">{{BADGE_TEXT}}</span>
  </div>

  <!-- Headline (template-specific) -->
  <div class="zone-headline">
    <div class="annonce-headline text-depth">{{HEADLINE}}</div>
  </div>

  <!-- Divider (template-specific) -->
  <div class="zone-divider">
    <div class="divider"></div>
  </div>

  <!-- Body (explanation block) -->
  <div class="explanation-block">
    <p class="explanation-text text-depth mark-tape">{{BODY_TEXT}}</p>
  </div>

  <!-- CTA (template-specific) -->
  <div class="zone-cta" style="display: {{SHOW_CTA}}">
    <div class="annonce-cta">{{CTA_TEXT}}</div>
  </div>

  <!-- Bottom Section (block) -->
  <div class="bottom-section">
    <div class="tagline">{{TAGLINE}}</div>
    <div class="logo-container">
      <img src="../_base/logo.svg" alt="STRICT FOOD'S">
    </div>
  </div>

</body>
</html>
