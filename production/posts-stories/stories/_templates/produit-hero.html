<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>Story Produit Hero — {{PRODUCT_NAME}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Oswald:wght@500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="_base/base.css">
  <style>
    /*
     * PRODUIT HERO — Visuel plein cadre + info produit minimale
     * Le produit EST la story. L'overlay est minimal et intégré.
     * Remplace vitrine.html pour une approche food porn.
     *
     * LIMITES DE CARACTÈRES :
     * PRODUCT_NAME     : max 22 car, 1 ligne
     * PRODUCT_INFO     : max 25 car, 1 ligne (ex: "97g protéines" ou "946 kcal" ou phrase d'accroche courte)
     */

    /* Disable all default overlays */
    .gradient-top, .gradient-bottom, .gradient-left, .accent-line, .zone-blend, .ambient-bottom, .content, .bottom-section { display: none; }

    /* ===== PHOTO PLEIN CADRE ===== */
    .hero-photo {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 40%;
      z-index: 1;
    }

    /* Photo presets */
    .photo-centre .hero-photo { object-position: 50% 40%; }
    .photo-droite .hero-photo { object-position: 75% 30%; }
    .photo-gauche .hero-photo { object-position: 25% 40%; }
    .photo-haut .hero-photo { object-position: 50% 20%; }
    .photo-bas .hero-photo { object-position: 50% 65%; }
    .photo-large .hero-photo { object-position: 50% 50%; transform: scale(1.15); }

    /* ===== GRADIENT BAS — plus doux que IRL, juste pour le texte ===== */
    .hero-gradient-bottom {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 550px;
      background: linear-gradient(to top, rgba(var(--bg-rgb), 0.88) 0%, rgba(var(--bg-rgb), 0.55) 35%, transparent 100%);
      z-index: 2;
    }

    /* ===== PRODUCT INFO — zone basse, au-dessus de la tagline ===== */
    .product-zone {
      position: absolute;
      bottom: 220px;
      left: 70px;
      right: 70px;
      z-index: 10;
      text-align: center;
    }

    .product-name {
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: 72px;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: -1px;
      line-height: 1.0;
      text-shadow:
        0 0 6px rgba(0,0,0,0.9),
        0 2px 10px rgba(0,0,0,0.7),
        0 4px 30px rgba(0,0,0,0.4);
    }

    .product-info {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 34px;
      color: var(--accent);
      margin-top: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      filter: brightness(1.2);
      text-shadow:
        0 0 4px rgba(0,0,0,0.8),
        0 2px 8px rgba(0,0,0,0.5);
    }

    .product-divider {
      width: 50px;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      margin: 16px auto 0;
      border-radius: 2px;
    }

    /* ===== INFO POSITION VARIANTS ===== */
    /* Par défaut : centré en bas (au-dessus de tagline) */

    /* Variante : info en haut à gauche */
    .info-haut-gauche .product-zone {
      bottom: auto;
      top: 280px;
      left: 70px;
      right: auto;
      text-align: left;
      max-width: 500px;
    }

    /* Variante : info en haut centré */
    .info-haut-centre .product-zone {
      bottom: auto;
      top: 280px;
      text-align: center;
    }

    /* Variante : info en bas à gauche */
    .info-bas-gauche .product-zone {
      text-align: left;
    }

    /* ===== BOTTOM : tagline + logo ===== */
    .hero-bottom {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      z-index: 10;
      text-align: center;
      padding: 40px 70px 80px;
    }
    .hero-bottom .tagline {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 36px;
      color: #fff;
      line-height: 1.3;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }
    .hero-bottom .tagline em { color: var(--accent); font-style: italic; }
    .hero-bottom .logo-container { margin-top: 14px; display: flex; justify-content: center; }
    .hero-bottom .logo-container img { width: 180px; height: auto; opacity: 0.80; }
  </style>
</head>
<body class="{{MOOD_CLASS}} {{PHOTO_PRESET}} {{INFO_POSITION}}">

  <!-- Visuel produit plein cadre -->
  <img class="hero-photo" src="{{BG_IMAGE_PATH}}" alt="">

  <!-- Gradient bas -->
  <div class="hero-gradient-bottom"></div>

  <!-- Info produit (optionnel — chaque champ peut être masqué) -->
  <div class="product-zone" style="display: {{SHOW_PRODUCT_INFO}}">
    <div class="product-name" style="display: {{SHOW_NAME}}">{{PRODUCT_NAME}}</div>
    <div class="product-info" style="display: {{SHOW_INFO}}">{{PRODUCT_INFO}}</div>
    <div class="product-divider" style="display: {{SHOW_DIVIDER}}"></div>
  </div>

  <!-- Bottom : tagline + logo -->
  <div class="hero-bottom">
    <div class="tagline">{{TAGLINE}}</div>
    <div class="logo-container">
      <img src="_base/logo.svg" alt="STRICT FOOD'S">
    </div>
  </div>

</body>
</html>
