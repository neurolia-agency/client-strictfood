<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>Story Educative — {{TITLE}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Oswald:wght@500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="_base/base.css">
  <style>
    /*
     * ÉDUCATIF — Chiffre clé + explication + VS optionnel
     * Cadre rigide : positions Y fixes pour chaque zone
     * Photo BG à droite, gradients à gauche
     *
     * LIMITES DE CARACTÈRES :
     * TITLE             : max 45 car, 2 lignes
     * FACT_NUMBER       : max 4 car, 1 ligne
     * FACT_UNIT         : max 25 car, 1 ligne
     * EXPLANATION       : max 120 car, 3 lignes
     * VS values         : max 6 car each
     * VS_THEIRS_LABEL   : max 20 car
     * TAGLINE           : max 40 car, 1 ligne
     */

    .content {
      padding: 0 70px 0;
      align-items: flex-start;
      justify-content: flex-start;
    }

    /* ===== FIXED POSITION ZONES ===== */
    /* Each zone has a fixed top position — content never pushes other zones */

    /* Logo déplacé en bas sous la tagline — évite doublon avec profil IG */

    .zone-label {
      position: absolute;
      top: 370px;
      left: 90px;
      z-index: 10;
    }

    .zone-title {
      position: absolute;
      top: 410px;
      left: 90px;
      right: 400px;
      z-index: 10;
      max-height: 130px; /* 2 lines safety */
      overflow: hidden;
    }

    .zone-fact {
      position: absolute;
      top: 570px;
      left: 90px;
      z-index: 10;
    }

    .zone-explanation {
      position: absolute;
      top: 870px;
      left: 90px;
      right: 350px;
      z-index: 10;
      max-height: 170px; /* 3 lines safety */
      overflow: hidden;
    }

    .zone-vs {
      position: absolute;
      top: 1100px;
      left: 70px;
      right: 70px;
      z-index: 10;
    }

    /* ===== TYPOGRAPHY ===== */
    .edu-label {
      font-family: 'DM Sans', sans-serif;
      font-size: 24px;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 6px;
      font-weight: 600;
      filter: brightness(1.2);
    }

    .edu-title {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 48px;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 3px;
      line-height: 1.2;
    }

    .fact-number {
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: 200px;
      color: var(--accent);
      line-height: 0.85;
      letter-spacing: -6px;
      filter: brightness(1.3);
    }

    .fact-unit {
      font-family: 'Oswald', sans-serif;
      font-weight: 500;
      font-size: 60px;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 6px;
    }

    .explanation {
      font-family: 'DM Sans', sans-serif;
      font-size: 34px;
      color: #fff;
      line-height: 1.6;
    }
    .explanation strong { color: var(--accent); font-weight: 600; filter: brightness(1.2); }

    /* ===== VS BLOCK (optional) ===== */
    .vs-block {
      display: flex;
      gap: 30px;
      width: 100%;
    }

    .vs-item {
      flex: 1;
      padding: 35px;
      border-radius: 20px;
      text-align: center;
    }
    .vs-item.ours {
      background: rgba(var(--accent-rgb),0.18);
      border: 2px solid rgba(var(--accent-rgb),0.45);
    }
    .vs-item.theirs {
      background: rgba(255,255,255,0.06);
      border: 2px solid rgba(255,255,255,0.15);
    }

    .vs-item .vs-label {
      font-family: 'DM Sans', sans-serif;
      font-size: 22px;
      color: rgba(255,255,255,0.85);
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 15px;
    }
    .vs-item.ours .vs-label { color: var(--accent); filter: brightness(1.1); }

    .vs-item .vs-value {
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: 80px;
      line-height: 1;
      margin-bottom: 8px;
    }
    .vs-item.ours .vs-value { color: var(--accent); filter: brightness(1.3); }
    .vs-item.theirs .vs-value { color: #fff; }

    .vs-item .vs-unit {
      font-family: 'DM Sans', sans-serif;
      font-size: 24px;
      color: rgba(255,255,255,0.85);
    }

    .vs-separator {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Oswald', sans-serif;
      font-size: 36px;
      color: rgba(255,255,255,0.65);
      font-weight: 700;
    }
  </style>
</head>
<body class="{{MOOD_CLASS}} {{IMG_CLASS}} {{OVERLAY_CLASS}} {{GRAD_CLASS}} {{PHOTO_PRESET}}">

  <!-- Optional background image -->
  <img class="bg-image" src="{{BG_IMAGE_PATH}}" alt="" style="display: {{SHOW_BG}}">

  <!-- Gradient overlays -->
  <div class="gradient-top"></div>
  <div class="gradient-bottom"></div>
  <div class="gradient-left"></div>
  <div class="ambient-bottom"></div>

  <!-- Decorative accent line -->
  <div class="accent-line"></div>

  <!-- Zone blend + product hero (dual-image pattern, optional) -->
  <div class="zone-blend" style="display: {{SHOW_HERO}}"></div>
  <img class="product-hero" src="{{HERO_IMAGE_PATH}}" alt="" style="display: {{SHOW_HERO}}">

  <!-- FIXED POSITION ZONES -->

  <div class="zone-label">
    <div class="edu-label {{LABEL_DEPTH}}">Le savais-tu ?</div>
  </div>

  <div class="zone-title">
    <div class="edu-title {{TITLE_DEPTH}}">{{TITLE}}</div>
  </div>

  <div class="zone-fact">
    <div class="fact-number">{{FACT_NUMBER}}</div>
    <div class="fact-unit">{{FACT_UNIT}}</div>
  </div>

  <div class="zone-explanation">
    <div class="explanation {{EXPL_DEPTH}} {{EXPL_TAPE}}">{{EXPLANATION}}</div>
  </div>

  <!-- VS block (optional) -->
  <div class="zone-vs" style="display: {{SHOW_VS}}">
    <div class="vs-block">
      <div class="vs-item ours">
        <div class="vs-label">Strict Food's</div>
        <div class="vs-value">{{VS_OURS_VALUE}}</div>
        <div class="vs-unit">{{VS_OURS_UNIT}}</div>
      </div>
      <div class="vs-separator">VS</div>
      <div class="vs-item theirs">
        <div class="vs-label">{{VS_THEIRS_LABEL}}</div>
        <div class="vs-value">{{VS_THEIRS_VALUE}}</div>
        <div class="vs-unit">{{VS_THEIRS_UNIT}}</div>
      </div>
    </div>
  </div>

  <!-- Bottom : tagline + logo -->
  <div class="bottom-section">
    <div class="tagline">{{TAGLINE}}</div>
    <div class="logo-container">
      <img src="_base/logo.svg" alt="STRICT FOOD'S">
    </div>
  </div>

</body>
</html>
