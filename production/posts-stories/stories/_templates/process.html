<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>Story Process — {{CAPTION}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Oswald:wght@500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="_base/base.css">
  <style>
    /*
     * PROCESS — Template avant/après ou étapes
     * Cadre rigide : photo top (920px) + bande séparation (80px) + photo bottom (710px) + bottom zone
     *
     * LIMITES DE CARACTÈRES :
     * LABEL_TOP          : max 20 car, 1 ligne
     * LABEL_BOTTOM       : max 20 car, 1 ligne
     * SEPARATOR_TEXT     : max 15 car, 1 ligne
     * CAPTION            : max 35 car, 2 lignes
     * TAGLINE            : max 40 car, 1 ligne
     */

    body { background: var(--bg); }

    /* Disable default overlays */
    .gradient-top, .gradient-bottom, .gradient-left, .accent-line, .zone-blend, .ambient-bottom, .content { display: none; }

    /* ===== PHOTO TOP — fixed 920px ===== */
    .photo-top-zone {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 920px;
      overflow: hidden;
      z-index: 1;
    }

    .photo-top {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 40%;
      filter: brightness(1.05) saturate(1.1);
      mask-image: linear-gradient(to bottom, transparent 0%, black 5%, black 85%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 5%, black 85%, transparent 100%);
    }

    /* Photo presets — top */
    .photo-top-centre .photo-top { object-position: 50% 40%; }
    .photo-top-droite .photo-top { object-position: 75% 30%; }
    .photo-top-gauche .photo-top { object-position: 25% 40%; }
    .photo-top-haut .photo-top { object-position: 50% 20%; }

    /* Label overlay on top photo */
    .label-top {
      position: absolute;
      top: 270px;
      left: 80px;
      z-index: 10;
      font-family: 'DM Sans', sans-serif;
      font-size: 22px;
      color: rgba(255,255,255,0.6);
      text-transform: uppercase;
      letter-spacing: 5px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }

    /* Logo overlay */
    .process-logo {
      position: absolute;
      top: 270px;
      right: 80px;
      z-index: 10;
      width: 120px;
      opacity: 0.7;
    }

    /* ===== SEPARATOR BAND ===== */
    .separator {
      position: absolute;
      top: 880px; left: 0; right: 0;
      height: 80px;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(to bottom,
        transparent 0%,
        rgba(var(--bg-rgb), 0.8) 30%,
        var(--bg) 50%,
        rgba(var(--bg-rgb), 0.8) 70%,
        transparent 100%
      );
    }

    .separator-line {
      width: 200px;
      height: 4px;
      background: var(--accent);
      border-radius: 2px;
      opacity: 0.8;
    }

    .separator-text {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 24px;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 4px;
      margin: 0 20px;
      filter: brightness(1.2);
    }

    /* ===== PHOTO BOTTOM — fixed from 960px ===== */
    .photo-bottom-zone {
      position: absolute;
      top: 940px; left: 0; right: 0;
      height: 730px;
      overflow: hidden;
      z-index: 1;
    }

    .photo-bottom {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 40%;
      filter: brightness(1.05) saturate(1.1);
      mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 70%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 70%, transparent 100%);
    }

    /* Photo presets — bottom */
    .photo-bottom-centre .photo-bottom { object-position: 50% 40%; }
    .photo-bottom-droite .photo-bottom { object-position: 75% 30%; }
    .photo-bottom-gauche .photo-bottom { object-position: 25% 40%; }
    .photo-bottom-haut .photo-bottom { object-position: 50% 20%; }

    /* Label overlay on bottom photo */
    .label-bottom {
      position: absolute;
      top: 960px;
      left: 80px;
      z-index: 10;
      font-family: 'DM Sans', sans-serif;
      font-size: 22px;
      color: rgba(255,255,255,0.6);
      text-transform: uppercase;
      letter-spacing: 5px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }

    /* ===== CAPTION — overlay on bottom photo ===== */
    .caption-zone {
      position: absolute;
      bottom: 300px;
      left: 80px;
      right: 80px;
      z-index: 10;
    }

    .caption-text {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 42px;
      color: #fff;
      line-height: 1.25;
      text-shadow: 0 3px 12px rgba(0,0,0,0.6), 0 6px 30px rgba(0,0,0,0.3);
      max-height: 110px; /* 2 lines safety */
      overflow: hidden;
    }

    .caption-text em {
      color: var(--accent);
      font-style: normal;
      filter: brightness(1.2);
    }

    /* ===== BOTTOM ZONE ===== */
    .bottom-zone {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 280px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 70px var(--safe-bottom);
      background: linear-gradient(to top, rgba(var(--bg-rgb), 0.95) 0%, rgba(var(--bg-rgb), 0.7) 60%, transparent 100%);
    }

    .tagline-process {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 36px;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .tagline-process em { color: var(--accent); font-style: italic; filter: brightness(1.15); }

    .footer-logo { margin-top: 16px; }
    .footer-logo img { width: 130px; height: auto; opacity: 0.6; }
  </style>
</head>
<body class="{{MOOD_CLASS}} {{PHOTO_PRESET_TOP}} {{PHOTO_PRESET_BOTTOM}}">

  <!-- PHOTO TOP (avant / étape 1) -->
  <div class="photo-top-zone">
    <img class="photo-top" src="{{IMAGE_TOP}}" alt="">
  </div>

  <!-- Labels -->
  <div class="label-top" style="display: {{SHOW_LABELS}}">{{LABEL_TOP}}</div>
  <img class="process-logo" src="_base/logo.svg" alt="STRICT FOOD'S">

  <!-- SEPARATOR BAND -->
  <div class="separator">
    <div class="separator-line"></div>
    <div class="separator-text" style="display: {{SHOW_SEPARATOR_TEXT}}">{{SEPARATOR_TEXT}}</div>
    <div class="separator-line"></div>
  </div>

  <!-- PHOTO BOTTOM (après / étape 2) -->
  <div class="photo-bottom-zone">
    <img class="photo-bottom" src="{{IMAGE_BOTTOM}}" alt="">
  </div>

  <!-- Label bottom -->
  <div class="label-bottom" style="display: {{SHOW_LABELS}}">{{LABEL_BOTTOM}}</div>

  <!-- CAPTION overlay -->
  <div class="caption-zone">
    <div class="caption-text">{{CAPTION}}</div>
  </div>

  <!-- BOTTOM -->
  <div class="bottom-zone">
    <div class="tagline-process">{{TAGLINE}}</div>
    <div class="footer-logo">
      <img src="_base/logo.svg" alt="STRICT FOOD'S">
    </div>
  </div>

</body>
</html>
