<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>Story IRL — {{IRL_TEXT}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Oswald:wght@500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="_base/base.css">
  <style>
    /* IRL Story — Photo brute avec overlay DA minimal */
    /* La photo est le héros. L'overlay est discret. */

    .irl-photo {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    /* Filtre warm léger — aligne avec la DA sans dénaturer */
    .irl-filter-leger .irl-photo {
      filter: brightness(1.05) sepia(0.06) saturate(0.95);
    }
    .irl-filter-moyen .irl-photo {
      filter: brightness(1.0) sepia(0.10) saturate(0.90);
    }
    .irl-filter-fort .irl-photo {
      filter: brightness(0.95) sepia(0.15) saturate(0.85);
    }

    /* Gradient bas uniquement — pour lisibilité du texte overlay */
    .irl-gradient-bottom {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 600px;
      background: linear-gradient(to top, rgba(var(--bg-rgb), 0.85) 0%, rgba(var(--bg-rgb), 0.5) 40%, transparent 100%);
      z-index: 2;
    }

    /* Gradient haut léger — pour le logo */
    .irl-gradient-top {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 350px;
      background: linear-gradient(to bottom, rgba(var(--bg-rgb), 0.5) 0%, transparent 100%);
      z-index: 2;
    }

    .content {
      padding: 0 80px;
      justify-content: flex-end;
      align-items: flex-start;
      text-align: left;
      padding-bottom: calc(var(--safe-bottom) + 40px);
    }

    /* Position texte variantes */
    .irl-text-centre .content {
      justify-content: center;
      align-items: center;
      text-align: center;
      padding-bottom: var(--safe-bottom);
    }
    .irl-text-haut .content {
      justify-content: flex-start;
      padding-top: calc(var(--safe-top) + 40px);
      padding-bottom: 0;
    }

    .irl-text {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 48px;
      color: #fff;
      line-height: 1.2;
      max-width: 800px;
      text-shadow:
        0 2px 8px rgba(0,0,0,0.6),
        0 4px 20px rgba(0,0,0,0.4);
    }

    .irl-text em {
      color: var(--accent);
      font-style: normal;
      filter: brightness(1.2);
    }

    /* Barre accent sous le texte */
    .irl-accent-bar {
      width: 60px;
      height: 4px;
      background: var(--accent);
      margin-top: 20px;
      border-radius: 2px;
    }

    /* Logo en haut à gauche — petit et discret */
    .irl-logo {
      position: absolute;
      top: calc(var(--safe-top) + 20px);
      left: 80px;
      z-index: 10;
      width: 120px;
      opacity: 0.8;
    }
  </style>
</head>
<body class="{{MOOD_CLASS}} irl-filter-{{IRL_FILTER}} irl-text-{{IRL_TEXT_POSITION}}">

  <!-- Photo IRL plein cadre -->
  <img class="irl-photo" src="{{BG_IMAGE_PATH}}" alt="">

  <!-- Gradients discrets -->
  <div class="irl-gradient-top"></div>
  <div class="irl-gradient-bottom"></div>

  <!-- Logo discret -->
  <img class="irl-logo" src="_base/logo.svg" alt="STRICT FOOD'S">

  <!-- Texte overlay (optionnel — peut être vide) -->
  <div class="content">
    <div class="irl-text text-depth" style="display: {{SHOW_TEXT}}">{{IRL_TEXT}}</div>
    <div class="irl-accent-bar" style="display: {{SHOW_TEXT}}"></div>
  </div>

</body>
</html>
