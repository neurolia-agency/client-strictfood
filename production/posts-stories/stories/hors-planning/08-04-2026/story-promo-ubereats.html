<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Space+Grotesk:wght@600;700&family=DM+Sans:wght@400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --amber-bg: #D4A43C;
    --uber-green: #3FC060;
    --uber-green-rgb: 63,192,96;
    --charbon: #1a1714;
    --charbon-rgb: 26,23,20;
    --safe-top: 250px;
    --safe-bottom: 80px;
  }

  body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: var(--charbon);
    position: relative;
  }

  /* ===== PHOTO MENU (haut) ===== */
  .photo-menu {
    position: absolute;
    top: 30px; left: 30px;
    width: 1020px;
    height: 700px;
    object-fit: cover;
    object-position: center 45%;
    border-radius: 20px;
    z-index: 1;
  }

  /* ===== ZONE TEXTE PROMO — vert Uber Eats ===== */
  .promo-zone {
    position: absolute;
    top: 748px; left: 0; right: 0;
    height: 320px;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 60px;
    text-align: center;
    background: transparent;
  }

  /* Pas de fondu — coupes franches entre les zones */

  .promo-label {
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    font-size: 30px;
    color: var(--uber-green);
    text-transform: uppercase;
    letter-spacing: 4px;
    margin-bottom: 24px;
  }

  .promo-offer {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 44px;
    color: #fff;
    line-height: 1.35;
    max-width: 900px;
  }

  .promo-offer strong {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 62px;
    display: block;
    margin-top: 8px;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  /* ===== PHOTO WRAP (bas) ===== */
  .photo-wrap {
    position: absolute;
    bottom: 275px; left: 30px;
    width: 1020px;
    height: 560px;
    object-fit: cover;
    object-position: center 75%;
    border-radius: 20px;
    z-index: 1;
  }

  /* ===== BADGE OFFERT ===== */
  .badge-offert {
    position: absolute;
    bottom: 560px; left: 130px;
    z-index: 10;
    background: var(--uber-green);
    color: #fff;
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 55px;
    letter-spacing: 4px;
    text-transform: uppercase;
    padding: 14px 36px;
    border-radius: 8px;
    transform: rotate(-4deg);
    box-shadow: 0 6px 24px rgba(0,0,0,0.25);
  }

  /* ===== BOTTOM — tagline + logo sur charbon ===== */
  .bottom-section {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 200px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-bottom: var(--safe-bottom);
  }

  .tagline {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 30px;
    color: #fff;
    line-height: 1.3;
    margin-bottom: 10px;
  }
  .tagline em {
    font-style: italic;
    color: rgba(255,255,255,0.70);
  }

  .logo-container {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .logo-container svg {
    width: 150px;
    height: auto;
    opacity: 0.80;
  }
  .logo-container svg path,
  .logo-container svg g path {
    fill: #fff;
  }

  /* ===== GRAIN ===== */
  body::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 100;
    pointer-events: none;
    opacity: 0.025;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
    background-repeat: repeat;
    background-size: 256px 256px;
  }
</style>
