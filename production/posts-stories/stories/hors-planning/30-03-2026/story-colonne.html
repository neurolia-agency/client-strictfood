<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>Story Colonne — Strict Max Poulet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Oswald:wght@500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1080px;
      height: 1920px;
      background: #1a1714;
      overflow: hidden;
      position: relative;
      font-family: 'DM Sans', sans-serif;
      color: #fff;
    }

    /* Photo plein cadre */
    .photo {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 55% 40%;
      filter: brightness(1.20) saturate(1.10);
    }

    /* Gradient gauche pour lisibilite colonne */
    .gradient-left {
      position: absolute;
      top: 0; bottom: 0; left: 0;
      width: 350px;
      background: linear-gradient(to right, rgba(26,23,20,0.85) 0%, rgba(26,23,20,0.40) 60%, transparent 100%);
      z-index: 3;
    }

    /* Gradient bas pour tagline */
    .gradient-bottom {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 450px;
      background: linear-gradient(to top, rgba(26,23,20,0.90) 0%, rgba(26,23,20,0.50) 40%, transparent 100%);
      z-index: 3;
    }

    /* ===== LA COLONNE — bandeau vertical texture sesame ===== */
    .colonne {
      position: absolute;
      left: 65px;
      top: 250px;
      bottom: 80px;
      width: 140px;
      z-index: 5;
      overflow: hidden;
      border-radius: 4px;
    }
    .colonne-texture {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.55;
      filter: sepia(0.15) saturate(1.3) brightness(0.85) contrast(1.2);
      mask-image: linear-gradient(to bottom, transparent 0%, black 5%, black 90%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 5%, black 90%, transparent 100%);
    }

    /* Filet ambre sur le bord droit de la colonne */
    .colonne::after {
      content: '';
      position: absolute;
      top: 5%; bottom: 5%; right: 0;
      width: 3px;
      background: linear-gradient(to bottom, transparent, #FABA43 15%, #FABA43 85%, transparent);
      border-radius: 2px;
    }

    /* ===== TEXTE VERTICAL le long de la colonne ===== */
    .text-vertical {
      position: absolute;
      left: 230px;
      top: 50%;
      transform: rotate(-90deg) translateX(50%);
      transform-origin: left center;
      z-index: 10;
      white-space: nowrap;
    }
    .text-vertical .word-1 {
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: 78px;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: -2px;
      text-shadow:
        0 0 6px rgba(0,0,0,0.9),
        0 2px 10px rgba(0,0,0,0.7),
        0 4px 30px rgba(0,0,0,0.4);
    }
    .text-vertical .word-2 {
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: 78px;
      color: #FABA43;
      text-transform: uppercase;
      letter-spacing: -2px;
      text-shadow:
        0 0 6px rgba(0,0,0,0.9),
        0 2px 10px rgba(0,0,0,0.7);
    }

    /* ===== BOTTOM ===== */
    .story-bottom {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      z-index: 10;
      text-align: center;
      padding: 30px 70px 80px;
    }
    .tagline {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 36px;
      color: #fff;
      line-height: 1.3;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }
    .tagline em { color: #FABA43; font-style: italic; }
    .logo-container { margin-top: 14px; }
    .logo-container img { width: 160px; height: auto; opacity: 0.80; }

    /* Film grain */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 100;
      pointer-events: none;
      opacity: 0.03;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 256px;
    }
  </style>
</head>
<body>

  <!-- Photo plein cadre (image IA generee) -->
  <img class="photo" src="/Users/dorian.gz/dev/Neurolia Agency/client-strictfood/production/posts-stories/stories/hors-planning/30-03-2026/brouillons/30-03-2026-strict-max-poulet-ambre-halo.png" alt="">

  <!-- Gradients -->
  <div class="gradient-left"></div>
  <div class="gradient-bottom"></div>

  <!-- La Colonne — texture sesame verticale -->
  <div class="colonne">
    <img class="colonne-texture" src="/Users/dorian.gz/dev/Neurolia Agency/client-strictfood/public/images/photos-references/produits-source/burgers-black/strict-boeuf/bun-macro.png" alt="">
  </div>

  <!-- Texte vertical -->
  <div class="text-vertical">
    <span class="word-1">STRICT </span><span class="word-2">MAX POULET</span>
  </div>

  <!-- Bottom -->
  <div class="story-bottom">
    <div class="tagline">Le cheat meal <em>qui n'en est pas un</em></div>
    <div class="logo-container">
      <img src="/Users/dorian.gz/dev/Neurolia Agency/client-strictfood/production/posts-stories/stories/_templates/_base/logo.svg" alt="STRICT FOOD'S">
    </div>
  </div>

</body>
</html>
