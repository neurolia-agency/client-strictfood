<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Oswald:wght@500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== FOND AMBRE ===== */
    .bg-ambre {
      position: absolute; inset: 0; z-index: 0;
      background-color: #FABA43;
      background-image:
        radial-gradient(ellipse 90% 70% at 50% 45%,
          rgba(255,210,100,0.40) 0%, transparent 55%),
        radial-gradient(ellipse 70% 50% at 20% 80%,
          rgba(200,140,30,0.30) 0%, transparent 50%),
        radial-gradient(ellipse 60% 60% at 85% 15%,
          rgba(180,120,20,0.20) 0%, transparent 50%);
    }

    /* ===== GRAPHIC ELEMENTS — charbon sur ambre, parcimonieux ===== */
    .filet {
      position: absolute; inset: 12px;
      border: 2px solid rgba(26,23,20,0.10);
      border-radius: 4px; z-index: 12; pointer-events: none;
    }

    .tech-tl {
      position: absolute; top: 55px; left: 40px;
      width: 100px; height: 65px;
      border-top: 1.5px solid rgba(26,23,20,0.15);
      border-left: 1.5px solid rgba(26,23,20,0.15);
      z-index: 12;
    }
    .tech-br {
      position: absolute; bottom: 55px; right: 40px;
      width: 100px; height: 65px;
      border-bottom: 1.5px solid rgba(26,23,20,0.10);
      border-right: 1.5px solid rgba(26,23,20,0.10);
      z-index: 12;
    }

    .gfx-line { position: absolute; z-index: 7; pointer-events: none; }
    .gfx-line-1 {
      top: 750px; left: -50px; width: 1200px; height: 1.5px;
      background: linear-gradient(90deg, transparent, rgba(26,23,20,0.08) 30%, rgba(26,23,20,0.04) 70%, transparent);
      transform: rotate(-3deg);
    }

    .gfx-bar-top {
      position: absolute;
      top: 340px; left: -100px;
      width: 1400px; height: 45px;
      background: linear-gradient(90deg,
        rgba(26,23,20,0.14) 0%, rgba(26,23,20,0.08) 50%,
        transparent 100%);
      transform: rotate(-12deg);
      z-index: 7; pointer-events: none;
    }

    .gfx-circle {
      position: absolute; border-radius: 50%;
      border: 1.5px solid rgba(26,23,20,0.06);
      z-index: 7; pointer-events: none;
    }
    .gfx-circle-1 { bottom: 420px; left: 60px; width: 65px; height: 65px; }

    .gfx-dots { position: absolute; z-index: 7; pointer-events: none; display: flex; flex-direction: column; gap: 10px; }
    .gfx-dots .row { display: flex; gap: 10px; }
    .gfx-dots .dot { width: 4px; height: 4px; border-radius: 50%; background: rgba(26,23,20,0.10); }
    .gfx-dots-1 { top: 350px; left: 55px; }

    .ember { position: absolute; border-radius: 50%; z-index: 8; }
    .ember-1 { top: 280px; right: 120px; width: 5px; height: 5px; background: rgba(26,23,20,0.25); box-shadow: 0 0 10px 4px rgba(26,23,20,0.10); }
    .ember-2 { top: 440px; right: 200px; width: 3px; height: 3px; background: rgba(26,23,20,0.18); box-shadow: 0 0 8px 3px rgba(26,23,20,0.06); }

    .brand-burger-xl {
      position: absolute; left: -60px; bottom: 280px;
      width: 350px; height: 350px; opacity: 0.04;
      transform: rotate(-12deg); z-index: 7; pointer-events: none;
    }

    /* ===== CONTENT ===== */
    .content {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 250px 80px 160px;
      text-align: center;
    }

    .label-top {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 28px;
      color: rgba(26,23,20,0.50);
      text-transform: uppercase;
      letter-spacing: 8px;
      margin-bottom: 50px;
    }

    .headline {
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: 180px;
      color: #1a1714;
      text-transform: uppercase;
      line-height: 0.9;
      letter-spacing: -4px;
      margin-bottom: 30px;
    }

    .sub-headline {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 42px;
      color: #1a1714;
      text-transform: uppercase;
      letter-spacing: 5px;
      margin-bottom: 60px;
    }

    .divider {
      width: 80px; height: 3px;
      background: rgba(26,23,20,0.25);
      border-radius: 2px;
      margin-bottom: 55px;
    }

    .body-text {
      font-family: 'DM Sans', sans-serif;
      font-size: 36px;
      font-weight: 500;
      color: rgba(26,23,20,0.70);
      line-height: 1.5;
      max-width: 750px;
    }
    .body-text strong {
      color: #1a1714;
      font-weight: 700;
    }

    /* ===== BOTTOM ===== */
    .story-bottom {
      position: absolute; bottom: 0; left: 0; right: 0;
      z-index: 12; text-align: center;
      padding: 0 70px 80px;
    }
    .story-bottom .tagline {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700; font-size: 34px;
      color: #1a1714;
    }
    .story-bottom .tagline em {
      color: rgba(26,23,20,0.55);
      font-style: italic;
    }
    .story-bottom .logo-container {
      margin-top: 14px;
      display: flex; justify-content: center;
    }
    .story-bottom .logo-container img {
      width: 350px; height: auto;
      opacity: 0.80;
      filter: brightness(0) saturate(100%);
    }

    /* ===== GRAIN ===== */
    .grain {
      position: absolute; inset: 0; z-index: 50;
      pointer-events: none; opacity: 0.04; mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
      background-size: 256px;
    }
  </style>
</head>
<body>

  <div class="bg-ambre"></div>
  <div class="filet"></div>

  <!-- GRAPHIC ELEMENTS — charbon sur ambre, parcimonieux -->
  <div class="tech-tl"></div>
  <div class="tech-br"></div>
  <div class="gfx-line gfx-line-1"></div>
  <div class="gfx-bar-top"></div>
  <div class="gfx-circle gfx-circle-1"></div>
  <div class="gfx-dots gfx-dots-1">
    <div class="row"><div class="dot"></div><div class="dot"></div></div>
    <div class="row"><div class="dot"></div><div class="dot"></div></div>
  </div>

  <svg class="brand-burger-xl" viewBox="295 -2 62 57" fill="#1a1714">
    <path d="M301.14,27.2s23.15-7.06,48.17-6.88c9.57.07-2.47-22.65-27.13-20.12-.26.03-.53.07-.79.12-22.86,4.79-23.62,19.86-23.62,19.86,0,0-2.25,8.21,3.37,7.02Z"/>
    <path d="M328.32,35.59c-17.57,3.75-2-2.84,15.01-3.21,8.42-.18,6.69-3.05-2.32-2.69-47.3,1.94.58-3.37,9.16-4.11,1.12-.1,2.05-2.69-1.21-2.84,0,0-29.98-.18-45.5,8-17.38,9.16,19.68.42,21.33,1.58,0,0-13.48,2.74-20.26,6.71-5.93,3.47,30.72-3.81,49.17-2.81,9,.49-3.71-5.25-25.38-.63Z"/>
    <path d="M301.55,49.28c5.53,3.9,42.86,7.27,51.08-6.11,4.37-10.48-60.87-1.63-51.08,6.11Z"/>
  </svg>

  <!-- CONTENT -->
  <div class="content">
    <div class="label-top">Ce vendredi 11 avril</div>
    <div class="headline">FERMÉ</div>
    <div class="sub-headline">Exceptionnellement ce soir</div>
    <div class="divider"></div>
    <div class="body-text">On se retrouve <strong>demain</strong> aux horaires habituels.<br>Même place, mêmes saveurs.</div>
  </div>

  <!-- BOTTOM -->
  <div class="story-bottom">
    <div class="tagline">Le cheat meal <em>qui n'en est pas un</em></div>
    <div class="logo-container">
      <img src="file:///Users/dorian.gz/dev/Neurolia%20Agency/client-strictfood/production/posts-stories/stories/_templates/_base/logo.svg" alt="STRICT FOOD'S">
    </div>
  </div>

  <div class="grain"></div>

</body>
</html>
