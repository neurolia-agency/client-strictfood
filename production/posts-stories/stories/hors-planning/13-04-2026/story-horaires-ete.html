<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Space+Grotesk:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --accent: #FABA43;
    --accent-rgb: 250,186,67;
    --bg: #1a1714;
    --bg-rgb: 26,23,20;
    --safe-top: 250px;
    --safe-bottom: 80px;
  }

  body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    position: relative;
    font-family: 'DM Sans', sans-serif;
    color: #fff;
    background:
      radial-gradient(ellipse 80% 50% at 15% 10%, rgba(250,186,67,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 50% 70% at 85% 80%, rgba(160,64,53,0.05) 0%, transparent 55%),
      radial-gradient(ellipse 90% 90% at 50% 50%, #1a1108 0%, #141210 100%);
  }

  /* ===== BARRE DIAGONALE ===== */
  .barre-diag {
    position: absolute;
    top: 200px; left: -200px;
    width: 1600px; height: 50px;
    background: linear-gradient(90deg, transparent 5%, rgba(var(--accent-rgb), 0.08) 25%, rgba(var(--accent-rgb), 0.12) 50%, rgba(var(--accent-rgb), 0.06) 75%, transparent 95%);
    transform: rotate(-25deg);
    z-index: 2;
  }

  .barre-diag-2 {
    position: absolute;
    bottom: 300px; right: -150px;
    width: 1100px; height: 35px;
    background: linear-gradient(90deg, transparent 5%, rgba(var(--accent-rgb), 0.05) 30%, rgba(var(--accent-rgb), 0.08) 50%, rgba(var(--accent-rgb), 0.04) 70%, transparent 95%);
    transform: rotate(-25deg);
    z-index: 2;
  }

  /* ===== TECH-FRAME ===== */
  .tech-corner { position: absolute; z-index: 2; }
  .tech-corner::before, .tech-corner::after { content: ''; position: absolute; background: rgba(var(--accent-rgb), 0.22); }
  .tc-tl { top: 28px; left: 28px; }
  .tc-tl::before { top: 0; left: 0; width: 80px; height: 2px; }
  .tc-tl::after { top: 0; left: 0; width: 2px; height: 55px; }
  .tc-tr { top: 28px; right: 28px; }
  .tc-tr::before { top: 0; right: 0; width: 80px; height: 2px; }
  .tc-tr::after { top: 0; right: 0; width: 2px; height: 55px; }
  .tc-bl { bottom: 28px; left: 28px; }
  .tc-bl::before { bottom: 0; left: 0; width: 80px; height: 2px; }
  .tc-bl::after { bottom: 0; left: 0; width: 2px; height: 55px; }
  .tc-br { bottom: 28px; right: 28px; }
  .tc-br::before { bottom: 0; right: 0; width: 80px; height: 2px; }
  .tc-br::after { bottom: 0; right: 0; width: 2px; height: 55px; }

  /* ===== FILET DORE ===== */
  .filet-dore {
    position: absolute;
    top: 14px; left: 14px; right: 14px; bottom: 14px;
    border: 1.5px solid rgba(var(--accent-rgb), 0.10);
    z-index: 2;
    pointer-events: none;
  }

  /* ===== GLOW ===== */
  .glow-ambre {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 550px;
    background: radial-gradient(ellipse 100% 100% at 50% 100%, rgba(var(--accent-rgb), 0.08) 0%, transparent 70%);
    z-index: 2;
    pointer-events: none;
  }

  /* ===== EMBERS ===== */
  .ember { position: absolute; border-radius: 50%; background: rgba(var(--accent-rgb), 0.75); z-index: 2; }
  .ember-1 { top: 420px; right: 130px; width: 5px; height: 5px; box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.5), 0 0 25px rgba(var(--accent-rgb), 0.2); opacity: 0.65; }
  .ember-2 { top: 1050px; left: 75px; width: 4px; height: 4px; box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.4); opacity: 0.45; }
  .ember-3 { bottom: 480px; right: 180px; width: 3px; height: 3px; box-shadow: 0 0 6px rgba(var(--accent-rgb), 0.5); opacity: 0.55; }

  /* ===== BURGER ICONS (decoratifs) ===== */
  .burger-icon {
    position: absolute;
    z-index: 2;
    pointer-events: none;
  }
  .burger-icon svg { fill: rgba(var(--accent-rgb), 1); }
  .burger-icon-1 { top: 620px; right: 55px; width: 100px; opacity: 0.05; transform: rotate(18deg); }
  .burger-icon-2 { bottom: 650px; left: 40px; width: 70px; opacity: 0.04; transform: rotate(-12deg); }
  .burger-icon-3 { top: 330px; left: 120px; width: 55px; opacity: 0.035; transform: rotate(35deg); }

  /* ===== GRAIN ===== */
  body::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 100;
    pointer-events: none;
    opacity: 0.04;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
    background-repeat: repeat;
    background-size: 256px 256px;
  }

  /* ===== CONTENU ===== */
  .content {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    display: flex;
    flex-direction: column;
    padding: calc(var(--safe-top) + 20px) 80px var(--safe-bottom);
  }

  /* ===== HEADER ===== */
  .label-top {
    font-family: 'DM Sans', sans-serif;
    font-size: 22px;
    font-weight: 600;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 10px;
    margin-bottom: 25px;
    text-align: center;
  }

  .headline-main {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 155px;
    text-transform: uppercase;
    line-height: 0.85;
    letter-spacing: -2px;
    text-align: center;
    color: #fff;
  }

  .headline-outline {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 135px;
    text-transform: uppercase;
    line-height: 0.9;
    letter-spacing: 4px;
    text-align: center;
    -webkit-text-stroke: 2.5px rgba(var(--accent-rgb), 0.50);
    color: transparent;
    margin-bottom: 60px;
  }

  /* ===== SCHEDULE — 2 blocs visuels ===== */
  .schedule {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 30px;
    padding: 0 10px;
  }

  /* Bloc service */
  .service-block {
    display: flex;
    align-items: baseline;
    gap: 30px;
  }

  .service-label {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 20px;
    text-transform: uppercase;
    letter-spacing: 5px;
    color: var(--accent);
    writing-mode: vertical-lr;
    transform: rotate(180deg);
    min-height: 80px;
    display: flex;
    align-items: center;
  }

  .service-content {
    flex: 1;
    border-left: 2px solid rgba(var(--accent-rgb), 0.20);
    padding-left: 30px;
  }

  .service-hours {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 72px;
    color: #fff;
    letter-spacing: 2px;
    line-height: 1;
    margin-bottom: 8px;
  }

  .service-hours span {
    font-size: 42px;
    color: rgba(255,255,255,0.45);
    font-weight: 600;
    margin: 0 4px;
  }

  .service-days {
    font-family: 'DM Sans', sans-serif;
    font-size: 26px;
    font-weight: 500;
    color: rgba(255,255,255,0.50);
    letter-spacing: 1px;
  }

  /* Separateur */
  .schedule-sep {
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, rgba(var(--accent-rgb), 0.20) 0%, rgba(var(--accent-rgb), 0.05) 100%);
    margin: 5px 0;
  }

  /* Ferme */
  .ferme-line {
    display: flex;
    align-items: center;
    gap: 16px;
    padding-left: 55px;
  }

  .ferme-day {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 24px;
    color: rgba(255,255,255,0.25);
    text-transform: uppercase;
    letter-spacing: 4px;
  }

  .ferme-tag {
    font-family: 'DM Sans', sans-serif;
    font-size: 18px;
    font-weight: 600;
    color: rgba(255,255,255,0.20);
    text-transform: uppercase;
    letter-spacing: 3px;
    padding: 4px 14px;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 4px;
  }

  /* ===== BOTTOM — logo gros + tagline ===== */
  .bottom-section {
    text-align: center;
    margin-top: auto;
    padding-top: 30px;
  }

  .logo-container {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 12px;
  }

  .logo-container svg {
    width: 320px;
    height: auto;
    opacity: 0.85;
  }

  .tagline {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 28px;
    color: rgba(255,255,255,0.55);
    line-height: 1.3;
  }
  .tagline em {
    font-style: italic;
    color: var(--accent);
  }

</style>
</head>
