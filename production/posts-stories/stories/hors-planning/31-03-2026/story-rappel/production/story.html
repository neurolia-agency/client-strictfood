<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>Story Rappel — Strict Poulet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Oswald:wght@500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #FABA43;
      --accent-rgb: 191,133,34;
      --bg: #141210;
      --bg-rgb: 20,18,16;
      --safe-top: 250px;
      --safe-bottom: 80px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1080px;
      height: 1920px;
      background: var(--bg);
      overflow: hidden;
      position: relative;
      font-family: 'DM Sans', sans-serif;
      color: #fff;
    }

    /* Film grain */
    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 100;
      pointer-events: none;
      opacity: 0.03;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 256px 256px;
    }

    /* ===== PHOTO PLEIN CADRE ===== */
    .photo {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 48%;
      z-index: 1;
    }

    /* ===== GRADIENT HAUT — couvre safe zone + fond pour le message ===== */
    .gradient-top {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 580px;
      background: linear-gradient(to bottom,
        rgba(var(--bg-rgb), 0.85) 0%,
        rgba(var(--bg-rgb), 0.70) 40%,
        rgba(var(--bg-rgb), 0.30) 75%,
        transparent 100%);
      z-index: 2;
    }

    /* ===== GRADIENT BAS — zone horaires + tagline ===== */
    .gradient-bottom {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 750px;
      background: linear-gradient(to top,
        rgba(var(--bg-rgb), 0.95) 0%,
        rgba(var(--bg-rgb), 0.85) 30%,
        rgba(var(--bg-rgb), 0.50) 60%,
        transparent 100%);
      z-index: 2;
    }

    /* ===== MESSAGE HAUT ===== */
    .message-top {
      position: absolute;
      top: 280px;
      left: 70px;
      right: 70px;
      z-index: 10;
      text-align: center;
    }

    .message-main {
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: 74px;
      text-transform: uppercase;
      line-height: 1.05;
      letter-spacing: -1px;
      color: #fff;
      text-shadow:
        0 0 6px rgba(0,0,0,0.9),
        0 2px 12px rgba(0,0,0,0.7),
        0 4px 30px rgba(0,0,0,0.4);
    }

    .message-main .accent {
      color: var(--accent);
      filter: brightness(1.2);
    }

    /* ===== ZONE HORAIRES (BAS) ===== */
    .horaires-zone {
      position: absolute;
      bottom: 260px;
      left: 70px;
      right: 70px;
      z-index: 10;
      text-align: center;
    }

    .ouvert {
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: 96px;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 12px;
      line-height: 1;
      filter: brightness(1.15);
      text-shadow:
        0 0 20px rgba(var(--accent-rgb), 0.4),
        0 0 60px rgba(var(--accent-rgb), 0.15),
        0 2px 8px rgba(0,0,0,0.8);
    }

    /* Trait decoratif sous OUVERT */
    .ouvert-divider {
      width: 120px;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      margin: 20px auto 36px;
      border-radius: 2px;
    }

    /* Container des deux colonnes horaires */
    .horaires-columns {
      display: flex;
      justify-content: center;
      gap: 100px;
    }

    .horaire-block {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .horaire-label {
      font-family: 'DM Sans', sans-serif;
      font-size: 26px;
      font-weight: 600;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 5px;
      margin-bottom: 8px;
      filter: brightness(1.2);
      text-shadow:
        0 0 4px rgba(0,0,0,0.8),
        0 2px 8px rgba(0,0,0,0.5);
    }

    .horaire-value {
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: 56px;
      color: #fff;
      letter-spacing: 2px;
      line-height: 1;
      text-shadow:
        0 0 6px rgba(0,0,0,0.9),
        0 2px 10px rgba(0,0,0,0.7),
        0 4px 20px rgba(0,0,0,0.4);
    }

    /* ===== BOTTOM : tagline + logo ===== */
    .story-bottom {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      z-index: 10;
      text-align: center;
      padding: 40px 70px var(--safe-bottom);
    }

    .tagline {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 36px;
      color: #fff;
      line-height: 1.3;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }

    .tagline em {
      color: var(--accent);
      font-style: italic;
    }

    .logo-container {
      margin-top: 14px;
      display: flex;
      justify-content: center;
    }

    .logo-container img {
      width: 180px;
      height: auto;
      opacity: 0.80;
    }
  </style>
</head>
<body>

  <!-- Photo plein cadre -->
  <img class="photo" src="/Users/dorian.gz/dev/Neurolia Agency/client-strictfood/production/posts-stories/stories/hors-planning/31-03-2026/story-rappel/brouillons/strict-poulet-charbon.png" alt="">

  <!-- Gradients -->
  <div class="gradient-top"></div>
  <div class="gradient-bottom"></div>

  <!-- Message principal -->
  <div class="message-top">
    <div class="message-main">
      DÉMARRE TA <span class="accent">SEMAINE</span><br>
      COMME IL SE DOIT
    </div>
  </div>

  <!-- Zone horaires -->
  <div class="horaires-zone">
    <div class="ouvert">OUVERT</div>
    <div class="ouvert-divider"></div>
    <div class="horaires-columns">
      <div class="horaire-block">
        <div class="horaire-label">Midi</div>
        <div class="horaire-value">11H–14H</div>
      </div>
      <div class="horaire-block">
        <div class="horaire-label">Soir</div>
        <div class="horaire-value">18H–22H</div>
      </div>
    </div>
  </div>

  <!-- Bottom : tagline + logo -->
  <div class="story-bottom">
    <div class="tagline">Le cheat meal <em>qui n'en est pas un</em></div>
    <div class="logo-container">
      <img src="/Users/dorian.gz/dev/Neurolia Agency/client-strictfood/production/posts-stories/stories/_templates/_base/logo.svg" alt="STRICT FOOD'S">
    </div>
  </div>

</body>
</html>
