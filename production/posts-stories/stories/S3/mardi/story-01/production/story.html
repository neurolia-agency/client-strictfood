<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>Story Produit Hero — STRICT BOEUF</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Oswald:wght@500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/Users/dorian.gz/dev/Neurolia Agency/client-strictfood/production/posts-stories/stories/_templates/_base/base.css">
  <style>
    .gradient-top, .gradient-bottom, .gradient-left, .accent-line, .zone-blend, .ambient-bottom, .content, .bottom-section { display: none; }

    .hero-photo {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 40%;
      z-index: 1;
    }

    .photo-centre .hero-photo { object-position: 50% 40%; }

    .hero-gradient-bottom {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 550px;
      background: linear-gradient(to top, rgba(var(--bg-rgb), 0.88) 0%, rgba(var(--bg-rgb), 0.55) 35%, transparent 100%);
      z-index: 2;
    }

    .product-zone {
      position: absolute;
      bottom: 220px;
      left: 70px;
      right: 70px;
      z-index: 10;
      text-align: center;
    }

    .product-name {
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: 72px;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: -1px;
      line-height: 1.0;
      text-shadow:
        0 0 6px rgba(0,0,0,0.9),
        0 2px 10px rgba(0,0,0,0.7),
        0 4px 30px rgba(0,0,0,0.4);
    }

    .product-info {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 34px;
      color: var(--accent);
      margin-top: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      filter: brightness(1.2);
      text-shadow:
        0 0 4px rgba(0,0,0,0.8),
        0 2px 8px rgba(0,0,0,0.5);
    }

    .product-divider {
      width: 50px;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      margin: 16px auto 0;
      border-radius: 2px;
    }

    .hero-bottom {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      z-index: 10;
      text-align: center;
      padding: 40px 70px 80px;
    }
    .hero-bottom .tagline {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 36px;
      color: #fff;
      line-height: 1.3;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }
    .hero-bottom .tagline em { color: var(--accent); font-style: italic; }
    .hero-bottom .logo-container { margin-top: 14px; display: flex; justify-content: center; }
    .hero-bottom .logo-container img { width: 180px; height: auto; opacity: 0.80; }
  </style>
</head>
<body class="mood-feuille photo-centre">

  <img class="hero-photo" src="/Users/dorian.gz/dev/Neurolia Agency/client-strictfood/production/posts-stories/stories/S3/mardi/story-01/brouillons/sublimation.png" alt="">

  <div class="hero-gradient-bottom"></div>

  <div class="product-zone" style="display: flex; flex-direction: column; align-items: center;">
    <div class="product-name" style="display: block">STRICT BOEUF</div>
    <div class="product-info" style="display: block">7 ingredients. Point.</div>
    <div class="product-divider" style="display: block"></div>
  </div>

  <div class="hero-bottom">
    <div class="tagline">Le cheat meal <em>qui n'en est pas un</em></div>
    <div class="logo-container">
      <img src="/Users/dorian.gz/dev/Neurolia Agency/client-strictfood/production/posts-stories/stories/_templates/_base/logo.svg" alt="STRICT FOOD'S">
    </div>
  </div>

</body>
</html>
