<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>Story — 0% HUILE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Oswald:wght@500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/Users/dorian.gz/dev/Neurolia Agency/client-strictfood/production/posts-stories/stories/_templates/_base/base.css">
  <style>
    /*
     * STORY UNIVERSAL — Photo plein cadre + overlay minimal
     * La photo EST la story. Le texte est un complement, jamais le sujet.
     * Remplace produit-hero.html, irl-story.html, et tous les templates text-heavy.
     *
     * LIMITES DE CARACTERES :
     * TEXT_LINE_1      : max 22 car, 1 ligne (nom produit, chiffre cle, annonce)
     * TEXT_LINE_2      : max 30 car, 1 ligne (info complementaire, sous-titre)
     *
     * CHAMPS :
     * BG_IMAGE_PATH    : chemin photo (obligatoire)
     * TEXT_LINE_1      : texte principal (optionnel)
     * TEXT_LINE_2      : texte secondaire (optionnel)
     * SHOW_TEXT        : block/none (defaut: block)
     * SHOW_DIVIDER     : block/none (defaut: none)
     * PHOTO_PRESET     : photo-centre / photo-droite / photo-gauche / photo-haut / photo-bas / photo-large
     * MOOD_CLASS       : mood-cuivre (defaut) / mood-grenat / mood-feuille
     * INFO_POSITION    : (vide=bas-centre) / info-haut-gauche / info-haut-centre / info-bas-gauche
     * IRL_FILTER       : none (defaut) / leger / moyen / fort
     * GRAIN            : (vide) / grain-subtle / grain-medium
     * TAGLINE          : Le cheat meal <em>qui n'en est pas un</em>
     */

    /* Disable all default overlays from base.css */
    .gradient-top, .gradient-bottom, .gradient-left, .accent-line, .zone-blend, .ambient-bottom, .content, .bottom-section { display: none; }

    /* ===== PHOTO PLEIN CADRE ===== */
    .photo {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 40%;
      z-index: 1;
    }

    /* Photo presets */
    .photo-centre .photo { object-position: 50% 40%; }
    .photo-droite .photo { object-position: 75% 30%; }
    .photo-gauche .photo { object-position: 25% 40%; }
    .photo-haut .photo { object-position: 50% 20%; }
    .photo-bas .photo { object-position: 50% 65%; }
    .photo-large .photo { object-position: 50% 50%; transform: scale(1.15); }
    .photo-portrait .photo { object-position: 50% 25%; transform: scale(1.1); }

    /* ===== FILTRES IRL (warm, pour photos reelles) ===== */
    .filter-leger .photo { filter: brightness(1.05) sepia(0.06) saturate(0.95); }
    .filter-moyen .photo { filter: brightness(1.0) sepia(0.10) saturate(0.90); }
    .filter-fort .photo { filter: brightness(0.95) sepia(0.15) saturate(0.85); }

    /* ===== GRADIENT HAUT (discret, pour safe zone IG) ===== */
    .story-gradient-top {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 350px;
      background: linear-gradient(to bottom, rgba(var(--bg-rgb), 0.45) 0%, transparent 100%);
      z-index: 2;
    }

    /* ===== GRADIENT BAS (zone texte + tagline) ===== */
    .story-gradient-bottom {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 550px;
      background: linear-gradient(to top, rgba(var(--bg-rgb), 0.88) 0%, rgba(var(--bg-rgb), 0.55) 35%, transparent 100%);
      z-index: 2;
    }

    /* ===== ZONE TEXTE — position par defaut : bas centre ===== */
    .text-zone {
      position: absolute;
      bottom: 220px;
      left: 70px;
      right: 70px;
      z-index: 10;
      text-align: center;
    }

    .text-line-1 {
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: 72px;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: -1px;
      line-height: 1.0;
      text-shadow:
        0 0 6px rgba(0,0,0,0.9),
        0 2px 10px rgba(0,0,0,0.7),
        0 4px 30px rgba(0,0,0,0.4);
    }

    .text-line-2 {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 34px;
      color: var(--accent);
      margin-top: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      filter: brightness(1.2);
      text-shadow:
        0 0 4px rgba(0,0,0,0.8),
        0 2px 8px rgba(0,0,0,0.5);
    }

    .text-divider {
      width: 50px;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      margin: 16px auto 0;
      border-radius: 2px;
    }

    /* ===== POSITIONS TEXTE ===== */

    /* Haut gauche */
    .info-haut-gauche .text-zone {
      bottom: auto;
      top: 280px;
      left: 70px;
      right: auto;
      text-align: left;
      max-width: 500px;
    }

    /* Haut centre */
    .info-haut-centre .text-zone {
      bottom: auto;
      top: 280px;
      text-align: center;
    }

    /* Bas gauche */
    .info-bas-gauche .text-zone {
      text-align: left;
    }

    /* ===== BOTTOM : tagline + logo ===== */
    .story-bottom {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      z-index: 10;
      text-align: center;
      padding: 40px 70px var(--safe-bottom);
    }
    .story-bottom .tagline {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 36px;
      color: #fff;
      line-height: 1.3;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }
    .story-bottom .tagline em { color: var(--accent); font-style: italic; }
    .story-bottom .logo-container { margin-top: 14px; display: flex; justify-content: center; }
    .story-bottom .logo-container img { width: 180px; height: auto; opacity: 0.80; }
  </style>
</head>
<body class="mood-cuivre photo-centre info-haut-centre filter-none grain-subtle">

  <!-- Photo plein cadre -->
  <img class="photo" src="/Users/dorian.gz/dev/Neurolia Agency/client-strictfood/production/posts-stories/stories/S3/mardi/story-03/brouillons/story-v5-steak.png" alt="">

  <!-- Gradients -->
  <div class="story-gradient-top"></div>
  <div class="story-gradient-bottom"></div>

  <!-- Zone texte — au-dessus du steak -->
  <div class="text-zone" style="display: block">
    <div class="text-line-1" style="display: block">PAS UNE SEULE</div>
    <div class="text-line-2" style="display: block; color: #fff; font-size: 42px;">GOUTTE D'HUILE</div>
    <div class="text-divider" style="display: none"></div>
  </div>

  <!-- Bottom : tagline + logo -->
  <div class="story-bottom">
    <div class="tagline">Le cheat meal <em>qui n'en est pas un</em></div>
    <div class="logo-container">
      <img src="/Users/dorian.gz/dev/Neurolia Agency/client-strictfood/production/posts-stories/stories/_templates/_base/logo.svg" alt="STRICT FOOD'S">
    </div>
  </div>

</body>
</html>
