<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>Story IRL — STRICT MAX Boeuf sublimé</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Oswald:wght@500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/Users/dorian.gz/dev/Neurolia Agency/client-strictfood/production/posts-stories/stories/_templates/_base/base.css">
  <style>
    /*
     * IRL — Photo brute plein cadre + overlay DA minimal
     * Cadre rigide : photo 100%, logo fixe, texte optionnel en bas
     * La photo est le héros. L'overlay est discret.
     *
     * LIMITES DE CARACTÈRES :
     * IRL_TEXT            : max 40 car, 2 lignes
     */

    /* Disable all default overlays */
    .gradient-top, .gradient-bottom, .gradient-left, .accent-line, .zone-blend, .ambient-bottom, .content, .bottom-section { display: none; }

    /* ===== PHOTO PLEIN CADRE ===== */
    .irl-photo {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 40%;
      z-index: 1;
    }

    /* Photo presets */
    .photo-centre .irl-photo { object-position: 50% 40%; }
    .photo-droite .irl-photo { object-position: 75% 30%; }
    .photo-gauche .irl-photo { object-position: 25% 40%; }
    .photo-haut .irl-photo { object-position: 50% 20%; }
    .photo-large .irl-photo { object-position: 50% 50%; transform: scale(1.15); }
    .photo-portrait .irl-photo { object-position: 50% 25%; transform: scale(1.1); }

    /* ===== FILTRES WARM ===== */
    .irl-filter-leger .irl-photo { filter: brightness(1.05) sepia(0.06) saturate(0.95); }
    .irl-filter-moyen .irl-photo { filter: brightness(1.0) sepia(0.10) saturate(0.90); }
    .irl-filter-fort .irl-photo { filter: brightness(0.95) sepia(0.15) saturate(0.85); }

    /* ===== GRADIENTS DISCRETS ===== */
    .irl-gradient-top {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 350px;
      background: linear-gradient(to bottom, rgba(var(--bg-rgb), 0.5) 0%, transparent 100%);
      z-index: 2;
    }

    .irl-gradient-bottom {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 600px;
      background: linear-gradient(to top, rgba(var(--bg-rgb), 0.85) 0%, rgba(var(--bg-rgb), 0.5) 40%, transparent 100%);
      z-index: 2;
    }

    /* ===== FIXED ELEMENTS ===== */
    .irl-bottom {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      z-index: 10;
      text-align: center;
      padding: 40px 70px 80px;
    }
    .irl-bottom .tagline {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 40px;
      color: #fff;
      line-height: 1.3;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }
    .irl-bottom .tagline em { color: #FABA43; font-style: italic; }
    .irl-bottom .logo-container { margin-top: 16px; display: flex; justify-content: center; }
    .irl-bottom .logo-container img { width: 200px; height: auto; opacity: 0.85; }

    /* Text — fixed at bottom */
    .irl-text-zone {
      position: absolute;
      bottom: 350px;
      left: 80px;
      right: 80px;
      z-index: 10;
      max-height: 120px;
      overflow: hidden;
    }

    /* Position variants */
    .irl-text-centre .irl-text-zone {
      bottom: auto;
      top: 50%;
      transform: translateY(-50%);
      text-align: center;
    }
    .irl-text-haut .irl-text-zone {
      bottom: auto;
      top: 370px;
    }

    .irl-text {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 48px;
      color: #fff;
      line-height: 1.2;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6), 0 4px 20px rgba(0,0,0,0.4);
    }
    .irl-text em {
      color: var(--accent);
      font-style: normal;
      filter: brightness(1.2);
    }

    .irl-accent-bar {
      width: 60px;
      height: 4px;
      background: var(--accent);
      margin-top: 20px;
      border-radius: 2px;
    }
  </style>
</head>
<body class="mood-grenat irl-filter-leger irl-text-bas photo-centre">

  <!-- Photo plein cadre -->
  <img class="irl-photo" src="/Users/dorian.gz/dev/Neurolia Agency/client-strictfood/public/images/photos-references/produits-source/burgers-black/strict-max-boeuf/strict-boeuf-ouvert.png" alt="">

  <!-- Gradients discrets -->
  <div class="irl-gradient-top"></div>
  <div class="irl-gradient-bottom"></div>

  <!-- Texte overlay (optionnel) -->
  <div class="irl-text-zone" style="display: none">
    <div class="irl-text text-depth"></div>
    <div class="irl-accent-bar"></div>
  </div>

  <!-- Bottom : tagline + logo -->
  <div class="irl-bottom">
    <div class="tagline">Le cheat meal <em>qui n'en est pas un</em></div>
    <div class="logo-container">
      <img src="/Users/dorian.gz/dev/Neurolia Agency/client-strictfood/production/posts-stories/stories/_templates/_base/logo.svg" alt="STRICT FOOD'S">
    </div>
  </div>

</body>
</html>
