  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Oswald:wght@500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px; height: 1350px; overflow: hidden; position: relative;
      font-family: 'DM Sans', sans-serif; color: #fff;
      background: #141210;
    }

    /* Grain */
    body::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      z-index: 100; pointer-events: none; opacity: 0.025; mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
      background-repeat: repeat; background-size: 256px 256px;
    }

    /* Ambre glows */
    .glow { position: absolute; z-index: 1; pointer-events: none; }
    .glow-1 { top: -50px; left: 200px; width: 600px; height: 500px; background: radial-gradient(circle, rgba(237,190,68,0.35) 0%, transparent 60%); }
    .glow-2 { bottom: 100px; right: -50px; width: 450px; height: 400px; background: radial-gradient(circle, rgba(250,186,67,0.22) 0%, transparent 55%); }
    .glow-3 { top: 500px; left: -80px; width: 400px; height: 350px; background: radial-gradient(circle, rgba(237,190,68,0.15) 0%, transparent 55%); }

    /* ===== STRUCTURAL: Garniture bands ===== */
    .garniture-band {
      position: absolute;
      top: 600px; left: -50px;
      width: 1200px; height: 80px;
      z-index: 3; pointer-events: none;
      transform: rotate(-5deg);
      opacity: 0.22;
    }
    .garniture-band-2 {
      position: absolute;
      top: 1080px; left: -30px;
      width: 1150px; height: 55px;
      z-index: 3; pointer-events: none;
      transform: rotate(-5deg);
      opacity: 0.16;
    }

    /* ===== STRUCTURAL: Dome arcs ===== */
    .dome-structure {
      position: absolute;
      top: 80px; left: 50%;
      transform: translateX(-50%);
      width: 700px; height: 120px;
      z-index: 6; pointer-events: none;
    }
    .dome-structure-bottom {
      position: absolute;
      top: 800px; left: 50%;
      transform: translateX(-50%) rotate(180deg);
      width: 700px; height: 100px;
      z-index: 6; pointer-events: none;
    }

    /* ===== STRUCTURAL: Sesame zone (left strip) ===== */
    .sesame-zone {
      position: absolute;
      top: 0; left: 0;
      width: 280px; height: 1350px;
      z-index: 2; pointer-events: none;
      overflow: hidden;
    }
    .sesame-zone .seed {
      position: absolute;
      border-radius: 50%;
      background: rgba(237,190,68,0.20);
    }

    /* ===== PHOTO ZONE ===== */
    .photo-zone {
      position: absolute;
      top: 120px; left: 50%;
      transform: translateX(-48%) rotate(2deg);
      width: 680px; height: 845px;
      z-index: 10;
      border-radius: 20px;
      overflow: hidden;
      box-shadow:
        0 15px 50px rgba(0,0,0,0.40),
        0 0 0 1px rgba(250,186,67,0.10),
        inset 0 1px 0 rgba(255,255,255,0.05);
    }
    .photo-zone img {
      width: 100%; height: 100%;
      object-fit: contain; object-position: center center;
    }
    .photo-placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 40%, rgba(250,186,67,0.15) 0%, transparent 60%), #3D2A0E;
    }
    .photo-placeholder span {
      font-family: 'Oswald', sans-serif; font-size: 28px;
      color: rgba(255,255,255,0.12); text-transform: uppercase; letter-spacing: 4px;
    }

    /* ===== KEYWORDS — ambre, empiles, tronques ===== */
    .kw-stack {
      position: absolute; z-index: 4; pointer-events: none; user-select: none;
      font-family: 'Oswald', sans-serif; font-weight: 700; text-transform: uppercase;
      line-height: 0.85;
    }
    .kw-left {
      left: -30px; top: 870px;
      font-size: 120px; letter-spacing: -3px;
      color: rgba(237,190,68,0.16);
      transform: rotate(-5deg);
    }
    .kw-left-2 {
      left: -10px; top: 980px;
      font-size: 80px; letter-spacing: -1px;
      color: rgba(255,255,255,0.08);
      transform: rotate(-5deg);
    }
    .kw-right {
      right: -50px; top: 160px;
      font-size: 140px; letter-spacing: -4px;
      color: rgba(237,190,68,0.10);
      transform: rotate(-5deg);
    }
    .kw-sm {
      font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px;
      letter-spacing: 5px; text-transform: uppercase;
      position: absolute; z-index: 4; pointer-events: none; user-select: none;
    }
    .kw-sm-1 { top: 120px; left: 45px; color: rgba(237,190,68,0.28); transform: rotate(-5deg); }
    .kw-sm-2 { top: 1100px; right: 55px; color: rgba(237,190,68,0.24); transform: rotate(-5deg); }
    .kw-sm-3 { top: 840px; left: 55px; color: rgba(255,255,255,0.12); transform: rotate(-5deg); }

    /* ===== TAGLINE BAND ===== */
    .tagline-band {
      position: absolute;
      bottom: 55px; left: -20px; right: -20px;
      z-index: 12;
      background: rgba(237,190,68,0.85);
      padding: 18px 0;
      transform: rotate(-3deg);
    }
    .tagline-band-inner {
      font-family: 'Space Grotesk', sans-serif; font-weight: 700;
      font-size: 22px; letter-spacing: 6px; text-transform: uppercase;
      color: #141210;
      white-space: nowrap;
      text-align: center;
    }
    .tagline-band-inner em {
      color: #141210; font-style: italic;
      text-decoration: underline;
      text-decoration-color: rgba(20,18,16,0.40);
    }

    /* ===== BURGER ICONS ===== */
    .brand-burger-xl {
      position: absolute; right: -80px; top: 700px;
      width: 450px; height: 450px;
      opacity: 0.12; transform: rotate(18deg);
      z-index: 3; pointer-events: none;
    }
    .brand-burger-sm { position: absolute; z-index: 3; pointer-events: none; }
    .bsm-1 { top: 40px; left: 50px; width: 55px; height: 55px; transform: rotate(-22deg); opacity: 0.18; }
    .bsm-2 { top: 1120px; right: 300px; width: 40px; height: 40px; transform: rotate(28deg); opacity: 0.14; }

    /* ===== LOGO TEXT ===== */
    .logo-text {
      position: absolute; z-index: 4; pointer-events: none; user-select: none;
      font-family: 'Oswald', sans-serif; font-weight: 700; text-transform: uppercase;
    }
    .logo-vertical {
      left: 20px; top: 850px;
      font-size: 90px; letter-spacing: 6px;
      color: rgba(237,190,68,0.07);
      writing-mode: vertical-rl;
    }
    .logo-sm {
      right: 45px; top: 90px;
      font-size: 18px; letter-spacing: 8px;
      color: rgba(237,190,68,0.30);
    }

    /* ===== EMBERS ===== */
    .ember { position: absolute; border-radius: 50%; z-index: 5; }
    .em-1 { top: 280px; right: 45px; width: 5px; height: 5px; background: #FABA43; box-shadow: 0 0 12px 5px rgba(250,186,67,0.50); }
    .em-2 { top: 950px; left: 60px; width: 6px; height: 6px; background: #EDBE44; box-shadow: 0 0 14px 5px rgba(237,190,68,0.45); }
    .em-3 { top: 1200px; right: 250px; width: 4px; height: 4px; background: #FABA43; box-shadow: 0 0 10px 4px rgba(250,186,67,0.40); }

    /* ===== ACCENT LINES ===== */
    .h-line {
      position: absolute; z-index: 3; pointer-events: none;
      height: 2px; border-radius: 1px;
      transform: rotate(-5deg);
    }
    .hl-1 { top: 110px; left: 0; width: 250px; background: linear-gradient(90deg, rgba(237,190,68,0.30), transparent); }
    .hl-2 { top: 830px; right: 0; width: 300px; background: linear-gradient(270deg, rgba(237,190,68,0.22), transparent); }
    .hl-3 { top: 1270px; left: 100px; width: 400px; background: linear-gradient(90deg, transparent, rgba(237,190,68,0.18), transparent); }
