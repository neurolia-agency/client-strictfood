<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Space+Grotesk:wght@500;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --accent: #BF8522;
  --accent-rgb: 191,133,34;
  --feuille: #6B8A5E;
  --grenat: #A04035;
  --bg: #141210;
  --bg-rgb: 20,18,16;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  width: 1080px;
  height: 1350px;
  background: var(--bg);
  overflow: hidden;
  position: relative;
  font-family: 'DM Sans', sans-serif;
  color: #ffffff;
}

body::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background:
    radial-gradient(ellipse 80% 50% at 15% 10%, rgba(191,133,34,0.08) 0%, transparent 60%),
    radial-gradient(ellipse 50% 70% at 85% 75%, rgba(160,64,53,0.05) 0%, transparent 55%),
    radial-gradient(ellipse 90% 90% at 50% 50%, #1a1108 0%, #141210 100%);
  z-index: 0;
}

body::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 100;
  pointer-events: none;
  opacity: 0.03;
  mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
  background-repeat: repeat;
  background-size: 256px 256px;
}

.content {
  position: relative;
  z-index: 10;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  padding: 65px 70px 55px;
}

/* Header — vertical stacked layout */
.header {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  margin-bottom: 40px;
  padding-bottom: 30px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  gap: 6px;
}

/* Top line: STRICT BŒUF */
.brand-left {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.brand-left .brand-label {
  font-family: 'DM Sans', sans-serif;
  font-size: 16px;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 6px;
  margin-bottom: 4px;
}

.brand-left .brand-name {
  font-family: 'Oswald', sans-serif;
  font-weight: 700;
  font-size: 64px;
  color: #ffffff;
  text-transform: uppercase;
  letter-spacing: 3px;
}

/* VS — massive, rotated */
.vs {
  position: relative;
  font-family: 'Oswald', sans-serif;
  font-weight: 700;
  font-size: 80px;
  color: var(--accent);
  letter-spacing: 8px;
  transform: rotate(-4deg);
  margin: -6px 0 4px;
}


/* Bottom line: BIG TASTY */
.brand-right {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.brand-right .brand-label {
  font-family: 'DM Sans', sans-serif;
  font-size: 16px;
  color: rgba(255,255,255,0.50);
  text-transform: uppercase;
  letter-spacing: 6px;
  margin-bottom: 4px;
}

.brand-right .brand-name {
  font-family: 'Oswald', sans-serif;
  font-weight: 700;
  font-size: 52px;
  color: rgba(255,255,255,0.55);
  text-transform: uppercase;
  letter-spacing: 3px;
}

/* Rows */
.rows {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 8px;
}

.row {
  display: flex;
  align-items: center;
  padding: 32px 0;
  position: relative;
}

.row-sep {
  width: 100%;
  height: 1px;
  background: rgba(255,255,255,0.05);
}

/* Left: StrictFood value — BIG */
.val-left {
  flex: 1;
  display: flex;
  align-items: baseline;
  gap: 6px;
}

.val-left .number {
  font-family: 'Oswald', sans-serif;
  font-weight: 700;
  font-size: 110px;
  line-height: 1;
  color: #ffffff;
}

.val-left .unit {
  font-family: 'Oswald', sans-serif;
  font-weight: 400;
  font-size: 36px;
  color: rgba(255,255,255,0.40);
}

/* Center: metric + percentage */
.label-center {
  width: 220px;
  text-align: center;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

.metric-name {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: 19px;
  color: rgba(255,255,255,0.40);
  text-transform: uppercase;
  letter-spacing: 5px;
}

.diff-pct {
  font-family: 'Oswald', sans-serif;
  font-weight: 700;
  font-size: 34px;
  color: var(--feuille);
  line-height: 1;
}

/* Right: Big Tasty value — smaller, dimmed, struck */
.val-right {
  flex: 1;
  display: flex;
  align-items: baseline;
  justify-content: flex-end;
  gap: 6px;
  position: relative;
}

.val-right .number {
  font-family: 'Oswald', sans-serif;
  font-weight: 700;
  font-size: 80px;
  line-height: 1;
  color: rgba(255,255,255,0.38);
}

.val-right .unit {
  font-family: 'Oswald', sans-serif;
  font-weight: 400;
  font-size: 28px;
  color: rgba(255,255,255,0.22);
}

/* Grenat vertical bar on Big Tasty side */
.row .lose-bar {
  position: absolute;
  right: -20px;
  top: 22%;
  bottom: 22%;
  width: 4px;
  background: var(--grenat);
  border-radius: 2px;
  opacity: 0.50;
}


/* Win bar accent */
.row .win-bar {
  position: absolute;
  left: -20px;
  top: 22%;
  bottom: 22%;
  width: 4px;
  background: var(--accent);
  border-radius: 2px;
}
</style>
</head>
<body>
  <div class="content">

    <div class="header">
      <div class="brand-left">
        <div class="brand-label">Strict Food's</div>
        <div class="brand-name">Strict Bœuf</div>
      </div>
      <div class="vs">VS</div>
      <div class="brand-right">
        <div class="brand-label">Burger King</div>
        <div class="brand-name">Steakhouse</div>
      </div>
    </div>

    <div class="rows">

      <!-- Calories -->
      <div class="row">
        <div class="win-bar"></div>
        <div class="lose-bar"></div>
        <div class="val-left">
          <div class="number">596</div>
          <div class="unit">kcal</div>
        </div>
        <div class="label-center">
          <div class="metric-name">Calories</div>
          <div class="diff-pct">−28%</div>
        </div>
        <div class="val-right">
          <div class="number">829</div>
          <div class="unit">kcal</div>
        </div>
      </div>

      <div class="row-sep"></div>

      <!-- Protéines -->
      <div class="row">
        <div class="win-bar"></div>
        <div class="lose-bar"></div>
        <div class="val-left">
          <div class="number">53</div>
          <div class="unit">g</div>
        </div>
        <div class="label-center">
          <div class="metric-name">Protéines</div>
          <div class="diff-pct">+43%</div>
        </div>
        <div class="val-right">
          <div class="number">37</div>
          <div class="unit">g</div>
        </div>
      </div>

      <div class="row-sep"></div>

      <!-- Lipides -->
      <div class="row">
        <div class="win-bar"></div>
        <div class="lose-bar"></div>
        <div class="val-left">
          <div class="number">21,5</div>
          <div class="unit">g</div>
        </div>
        <div class="label-center">
          <div class="metric-name">Lipides</div>
          <div class="diff-pct">−58%</div>
        </div>
        <div class="val-right">
          <div class="number">51</div>
          <div class="unit">g</div>
        </div>
      </div>

      <div class="row-sep"></div>

      <!-- Glucides -->
      <div class="row">
        <div class="win-bar"></div>
        <div class="lose-bar"></div>
        <div class="val-left">
          <div class="number">45</div>
          <div class="unit">g</div>
        </div>
        <div class="label-center">
          <div class="metric-name">Glucides</div>
          <div class="diff-pct">−17%</div>
        </div>
        <div class="val-right">
          <div class="number">54</div>
          <div class="unit">g</div>
        </div>
      </div>

    </div>

  </div>
</body>
</html>
