<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  .tagline {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;

    line-height: 1.4;

  .tagline em {

    color: oklch(0.67 0.15 68);
