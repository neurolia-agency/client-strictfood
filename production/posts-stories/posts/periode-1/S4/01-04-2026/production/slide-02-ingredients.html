<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1350px; overflow:hidden; background:#1a1714; position:relative; }

  .photo {
    position:absolute; top:0; left:0; width:100%; height:100%;
    object-fit:cover; object-position:50% 45%;
    z-index:1;
  }

  /* Léger assombrissement pour lisibilité des annotations */
  .overlay {
    position:absolute; inset:0; z-index:2;
    background: radial-gradient(ellipse at 50% 45%, transparent 30%, rgba(0,0,0,0.3) 100%);
  }

  /* Conteneur annotations */
  .annotations {
    position:absolute; inset:0; z-index:10;
  }

  /* Style commun annotations */
  .label {
    position:absolute;
    font-family:'Caveat', cursive;
    font-weight:500;
    font-size:50px;
    color:#fff;
    white-space:nowrap;
    text-shadow:
      0 1px 4px rgba(0,0,0,0.9),
      0 0 12px rgba(0,0,0,0.6);
  }

  /* Lignes/flèches en SVG */
  .arrows {
    position:absolute; inset:0; z-index:9;
    pointer-events:none;
  }

  .arrows line {
    stroke:#fff;
    stroke-width:1.5;
    stroke-linecap:round;
    filter: drop-shadow(0 1px 3px rgba(0,0,0,0.8));
  }

  /* Petite pointe de flèche */
  .arrows polygon {
    fill:#fff;
    filter: drop-shadow(0 1px 3px rgba(0,0,0,0.8));
  }

</style>
</head>
<body>

  <img class="photo" src="/Users/dorian.gz/dev/Neurolia Agency/client-strictfood/production/posts-stories/posts/periode-1/S4/01-04-2026/brouillons/01-04-2026-falafel-hero-face.png" alt="">
  <div class="overlay"></div>

  <div class="annotations">
    <!-- GAUCHE (empilés verticalement, bien à gauche) -->
    <div class="label" style="left:40px; top:90px;">Pain noir sésame</div>
    <div class="label" style="left:40px; top:420px;">Parmesan Myfitcheese</div>
    <div class="label" style="left:40px; top:700px;">Falafel au Air Fryer</div>

    <!-- DROITE (empilés verticalement, bien à droite) -->
    <div class="label" style="right:150px; top:100px;">Oignon rouge</div>
    <div class="label" style="right:40px; top:210px;">Mâche fraîche</div>
    <div class="label" style="right:140px; top:1000px;">Sauce poivron</div>
  </div>

  <svg class="arrows" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
        <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.7"/>
      </filter>
    </defs>

    <!-- Pain noir sésame (gauche y:145) → bun cap (~x492,y310) — arrive en bas-droite -->
    <path d="M340,145 C400,180 450,250 492,310" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" filter="url(#shadow)" />
    <line x1="492" y1="310" x2="480" y2="300" stroke="#fff" stroke-width="2" stroke-linecap="round" filter="url(#shadow)" />
    <line x1="492" y1="310" x2="498" y2="297" stroke="#fff" stroke-width="2" stroke-linecap="round" filter="url(#shadow)" />

    <!-- Parmesan Myfitcheese (gauche y:465) → parmesan (~x470,y575) — arrive en bas-droite -->
    <path d="M380,468 C415,500 440,540 460,575" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" filter="url(#shadow)" />
    <line x1="460" y1="575" x2="448" y2="565" stroke="#fff" stroke-width="2" stroke-linecap="round" filter="url(#shadow)" />
    <line x1="460" y1="575" x2="466" y2="562" stroke="#fff" stroke-width="2" stroke-linecap="round" filter="url(#shadow)" />

    <!-- Falafel au Air Fryer (gauche y:715) → galette (~x308,y650) — arrive vers le haut -->
    <path d="M280,712 C290,695 300,670 308,650" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" filter="url(#shadow)" />
    <line x1="308" y1="650" x2="300" y2="660" stroke="#fff" stroke-width="2" stroke-linecap="round" filter="url(#shadow)" />
    <line x1="308" y1="650" x2="316" y2="660" stroke="#fff" stroke-width="2" stroke-linecap="round" filter="url(#shadow)" />

    <!-- Oignon rouge (droite y:155) → oignon (~x542,y548) — arrive en bas-gauche -->
    <path d="M770,158 C720,280 640,430 542,548" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" filter="url(#shadow)" />
    <line x1="542" y1="548" x2="545" y2="534" stroke="#fff" stroke-width="2" stroke-linecap="round" filter="url(#shadow)" />
    <line x1="542" y1="548" x2="555" y2="542" stroke="#fff" stroke-width="2" stroke-linecap="round" filter="url(#shadow)" />

    <!-- Mâche fraîche (droite y:275) → mâche (~x740,y558) -->
    <path d="M830,278 C815,360 790,460 745,553" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" filter="url(#shadow)" />
    <path d="M740,546 Q746,556 753,549" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)" />

    <!-- Sauce poivron (droite y:1015) → sauce (~x700,y742) -->
    <path d="M780,1010 C750,920 730,830 706,748" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" filter="url(#shadow)" />
    <path d="M700,755 Q707,745 714,753" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)" />
  </svg>

</body></html>
