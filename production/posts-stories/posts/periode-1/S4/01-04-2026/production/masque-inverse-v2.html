<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Space+Grotesk:wght@700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1350px; overflow:hidden; background:#1a1714; position:relative; }

  /* Photo visible en fond (luminosité boostée) */
  .photo-bg {
    position:absolute; inset:0;
    background: url('/Users/dorian.gz/dev/Neurolia Agency/client-strictfood/production/posts-stories/posts/periode-1/S4/01-04-2026/brouillons/01-04-2026-falafel-hero-face.png') center 45% / cover no-repeat;
    filter: contrast(1.05) saturate(1.1) brightness(0.6);
    opacity:0.7;
  }

  /* Texte ambre solide géant par-dessus la photo */
  .mask-container {
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    z-index:2;
  }

  .mask-text {
    font-family:'Oswald', sans-serif; font-weight:700;
    font-size:260px; letter-spacing:12px; text-transform:uppercase;
    line-height:0.9; text-align:center;
    color:#FABA43;
  }

  /* Tagline */
  .tagline {
    position:absolute; bottom:80px; left:0; right:0; text-align:center;
    font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:22px;
    color:#fff; line-height:1.3; z-index:5;
  }
  .tagline em { font-style:italic; color:#FABA43; }

  .grain {
    position:absolute; inset:0; opacity:0.04; mix-blend-mode:overlay; pointer-events:none; z-index:10;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
    background-size:200px;
  }
</style>
</head>
<body>
  <div class="photo-bg"></div>
  <div class="mask-container">
    <div class="mask-text">FALAFEL</div>
  </div>
  <div class="tagline">Le cheat meal <em>qui n'en est pas un</em></div>
  <div class="grain"></div>
</body></html>
