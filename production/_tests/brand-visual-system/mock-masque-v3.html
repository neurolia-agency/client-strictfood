<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1350px; overflow:hidden; background:#E5A520; position:relative; }

  .bg {
    position:absolute; inset:0; background:#E5A520;
    background-image:
      radial-gradient(ellipse at 40% 60%, rgba(26,23,20,0.06) 0%, transparent 50%),
      radial-gradient(ellipse at 70% 30%, rgba(245,240,232,0.08) 0%, transparent 40%);
  }

  /* Masque : texte géant découpé révèle la photo du produit */
  .mask-container {
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    z-index:2;
  }

  .mask-text {
    font-family:'Oswald', sans-serif; font-weight:700;
    font-size:280px; letter-spacing:12px; text-transform:uppercase;
    line-height:0.9; text-align:center;
    /* La photo du burger remplit les lettres */
    background: url('../../../public/images/photos-references/dark-bg/burger-double-boeuf-dark-bg.jpg') center center / 220% auto no-repeat;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: contrast(1.15) saturate(1.2) brightness(1.1);
  }

  /* Tagline */
  .tagline {
    position:absolute; bottom:80px; left:0; right:0; text-align:center;
    font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:22px;
    color:#fff; line-height:1.3; z-index:5;
  }
  .tagline em { font-style:italic; color:#1a1714; }

  .grain {
    position:absolute; inset:0; opacity:0.04; mix-blend-mode:overlay; pointer-events:none; z-index:10;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
    background-size:200px;
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="mask-container">
    <div class="mask-text">STRICT<br>BOEUF</div>
  </div>
  <div class="tagline">Le cheat meal <em>qui n'en est pas un</em></div>
  <div class="grain"></div>
</body></html>
