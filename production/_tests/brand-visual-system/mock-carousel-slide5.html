<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Space+Grotesk:wght@600;700&family=DM+Sans:wght@400;500&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1350px; overflow:hidden; background:#1a1714; position:relative; }

  .bg {
    position:absolute; inset:0; background:#1a1714;
    background-image: radial-gradient(ellipse at 50% 60%, rgba(229,165,32,0.04) 0%, transparent 50%);
  }

  .content {
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:40px;
    z-index:2; padding:100px 80px;
  }

  .closing-headline {
    font-family:'Oswald', sans-serif; font-weight:700; font-size:64px;
    letter-spacing:4px; color:#E5A520; text-transform:uppercase; line-height:1.1;
    text-align:center;
  }

  .closing-body {
    font-family:'DM Sans', sans-serif; font-weight:400; font-size:26px;
    color:#f5f0e8; line-height:1.6; text-align:center; max-width:800px;
  }
  .closing-body strong { color:#E5A520; font-weight:500; }

  .separator { margin:10px 0; }

  .macro-row { display:flex; gap:50px; justify-content:center; margin-top:10px; }
  .macro-item { text-align:center; }
  .macro-value { font-family:'Oswald', sans-serif; font-weight:700; font-size:52px; color:#E5A520; line-height:1; }
  .macro-label { font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:14px; color:rgba(245,240,232,0.5); letter-spacing:3px; text-transform:uppercase; margin-top:6px; }

  .bottom {
    position:absolute; bottom:80px; left:0; right:0;
    display:flex; flex-direction:column; align-items:center; gap:16px;
  }
  .tagline { font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:22px; color:#fff; line-height:1.3; }
  .tagline em { font-style:italic; color:#E5A520; }

  .grain {
    position:absolute; inset:0; opacity:0.035; mix-blend-mode:overlay; pointer-events:none; z-index:10;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
    background-size:200px;
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="content">
    <div class="closing-headline">UN BURGER AVEC<br>LES BONS LIPIDES<br>ÇA EXISTE</div>

    <svg class="separator" viewBox="0 0 200 12" width="200" xmlns="http://www.w3.org/2000/svg">
      <path d="M 0,10 Q 100,0 200,10" fill="none" stroke="#E5A520" stroke-width="2" opacity="0.4"/>
    </svg>

    <div class="closing-body">
      <strong>21,5g de lipides</strong> dans un Strict Bœuf.<br>
      Pas d'huile de friture. Pas de gras trans.<br>
      Que des graisses naturelles issues de la viande et du parmesan.
    </div>

    <div class="macro-row">
      <div class="macro-item">
        <div class="macro-value">596</div>
        <div class="macro-label">Kcal</div>
      </div>
      <div class="macro-item">
        <div class="macro-value">53g</div>
        <div class="macro-label">Protéines</div>
      </div>
      <div class="macro-item">
        <div class="macro-value">21,5g</div>
        <div class="macro-label">Lipides</div>
      </div>
    </div>
  </div>

  <div class="bottom">
    <div class="tagline">Le cheat meal <em>qui n'en est pas un</em></div>
  </div>
  <div class="grain"></div>
</body></html>
