<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Space+Grotesk:wght@700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1350px; overflow:hidden; background:#1a1714; position:relative; }

  /* Photo produit plein cadre */
  .photo {
    position:absolute; inset:0;
    background: url('../../../public/images/photos-references/dark-bg/burger-double-boeuf-dark-bg.jpg') center center / cover no-repeat;
    filter: contrast(1.1) saturate(1.15) brightness(0.98);
  }

  /* Bande knockout avec bord dôme (arc du bun) */
  .knockout-band {
    position:absolute; bottom:0; left:0; right:0; height:260px;
    z-index:3;
  }
  .knockout-band svg {
    position:absolute; top:0; left:0; width:100%; height:100%;
  }

  /* Texte produit dans la bande */
  .product-name {
    position:absolute; bottom:100px; left:0; right:0;
    text-align:center; z-index:4;
    font-family:'Oswald', sans-serif; font-weight:700;
    font-size:72px; letter-spacing:8px; text-transform:uppercase;
    color:#1a1714;
  }

  /* Tagline sous la bande */
  .tagline {
    position:absolute; bottom:40px; left:0; right:0;
    text-align:center; z-index:4;
    font-family:'Space Grotesk', sans-serif; font-weight:700;
    font-size:20px; color:#f5f0e8; line-height:1.3;
  }
  .tagline em { font-style:italic; color:#E5A520; }

  .grain {
    position:absolute; inset:0; opacity:0.035; mix-blend-mode:overlay; pointer-events:none; z-index:10;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
    background-size:200px;
  }
</style>
</head>
<body>
  <div class="photo"></div>

  <!-- Bande ambre avec dôme bun -->
  <div class="knockout-band">
    <svg viewBox="0 0 1080 260" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M 0,60 Q 540,0 1080,60 L 1080,260 L 0,260 Z" fill="#E5A520"/>
    </svg>
  </div>

  <div class="product-name">STRICT MAX BOEUF</div>
  <div class="tagline">Le cheat meal <em>qui n'en est pas un</em></div>
  <div class="grain"></div>
</body></html>
