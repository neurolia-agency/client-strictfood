<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Space+Grotesk:wght@600;700&family=DM+Sans:wght@400;500&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1350px; overflow:hidden; background:#1a1714; position:relative; }

  .bg {
    position:absolute; inset:0; background:#1a1714;
    background-image: radial-gradient(ellipse at 50% 30%, rgba(229,165,32,0.03) 0%, transparent 60%);
  }

  .content {
    position:absolute; top:100px; left:80px; right:80px; bottom:100px;
    display:flex; flex-direction:column; justify-content:center; gap:50px;
    z-index:2;
  }

  .headline {
    font-family:'Oswald', sans-serif; font-weight:700; font-size:72px;
    letter-spacing:4px; color:#E5A520; text-transform:uppercase; line-height:1.05;
  }

  .body-text {
    font-family:'DM Sans', sans-serif; font-weight:400; font-size:28px;
    color:#f5f0e8; line-height:1.6;
  }
  .body-text strong { color:#E5A520; font-weight:500; }

  .stat-block { display:flex; align-items:baseline; gap:20px; margin-top:10px; }
  .stat-number { font-family:'Oswald', sans-serif; font-weight:700; font-size:140px; color:#E5A520; line-height:1; }
  .stat-unit { font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:22px; color:#f5f0e8; letter-spacing:2px; text-transform:uppercase; }
  .stat-context { font-family:'DM Sans', sans-serif; font-weight:400; font-size:20px; color:rgba(245,240,232,0.6); margin-top:5px; }

  .separator { width:200px; height:auto; }

  .grain {
    position:absolute; inset:0; opacity:0.035; mix-blend-mode:overlay; pointer-events:none; z-index:10;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
    background-size:200px;
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="content">
    <div class="headline">LE GRAS N'EST PAS<br>TON ENNEMI</div>

    <svg class="separator" viewBox="0 0 200 12" xmlns="http://www.w3.org/2000/svg">
      <path d="M 0,10 Q 100,0 200,10" fill="none" stroke="#E5A520" stroke-width="2" opacity="0.4"/>
    </svg>

    <div class="body-text">
      Pendant <strong>50 ans</strong>, on t'a dit que le gras était dangereux.
      Les études récentes montrent le contraire : ton corps a <strong>besoin</strong> de lipides
      de qualité pour fonctionner.
    </div>

    <div class="stat-block">
      <div>
        <div class="stat-number">60%</div>
        <div class="stat-unit">de ton cerveau</div>
        <div class="stat-context">est composé de graisses</div>
      </div>
    </div>
  </div>
  <div class="grain"></div>
</body></html>
