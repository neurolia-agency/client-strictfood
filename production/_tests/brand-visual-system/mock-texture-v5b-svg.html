<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Space+Grotesk:wght@700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1350px; overflow:hidden; background:#E5A520; position:relative; }

  .bg {
    position:absolute; inset:0; background:#E5A520;
    background-image:
      radial-gradient(ellipse at 40% 60%, rgba(26,23,20,0.06) 0%, transparent 50%),
      radial-gradient(ellipse at 70% 30%, rgba(245,240,232,0.08) 0%, transparent 40%);
  }

  /* Texture Fill SVG — Pattern sésame synthétique dans les lettres */
  .text-block {
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    z-index:2;
  }
  .text-block-inner {
    text-align:center;
    font-family:'Oswald', sans-serif; font-weight:700; text-transform:uppercase;
    line-height:1.1;
    /* Pattern SVG sésame synthétique (tile 240px, graines ~11x5px) */
    background-image: url("data:image/svg+xml,%3Csvg width='240' height='240' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='240' height='240' fill='%231a1714'/%3E%3Cellipse cx='30' cy='20' rx='5.5' ry='2.5' fill='%23c4953a' transform='rotate(15 30 20)'/%3E%3Cellipse cx='90' cy='45' rx='5.5' ry='2.5' fill='%23d4a43a' transform='rotate(-20 90 45)'/%3E%3Cellipse cx='160' cy='30' rx='5.5' ry='2.5' fill='%23c4953a' transform='rotate(35 160 30)'/%3E%3Cellipse cx='210' cy='60' rx='5.5' ry='2.5' fill='%23b8892e' transform='rotate(-10 210 60)'/%3E%3Cellipse cx='50' cy='80' rx='5.5' ry='2.5' fill='%23d4a43a' transform='rotate(25 50 80)'/%3E%3Cellipse cx='130' cy='90' rx='5.5' ry='2.5' fill='%23c4953a' transform='rotate(-30 130 90)'/%3E%3Cellipse cx='20' cy='130' rx='5.5' ry='2.5' fill='%23b8892e' transform='rotate(40 20 130)'/%3E%3Cellipse cx='100' cy='140' rx='5.5' ry='2.5' fill='%23d4a43a' transform='rotate(-15 100 140)'/%3E%3Cellipse cx='180' cy='120' rx='5.5' ry='2.5' fill='%23c4953a' transform='rotate(20 180 120)'/%3E%3Cellipse cx='60' cy='170' rx='5.5' ry='2.5' fill='%23c4953a' transform='rotate(-25 60 170)'/%3E%3Cellipse cx='140' cy='180' rx='5.5' ry='2.5' fill='%23b8892e' transform='rotate(10 140 180)'/%3E%3Cellipse cx='220' cy='160' rx='5.5' ry='2.5' fill='%23d4a43a' transform='rotate(30 220 160)'/%3E%3Cellipse cx='40' cy='220' rx='5.5' ry='2.5' fill='%23d4a43a' transform='rotate(-35 40 220)'/%3E%3Cellipse cx='110' cy='210' rx='5.5' ry='2.5' fill='%23c4953a' transform='rotate(5 110 210)'/%3E%3Cellipse cx='190' cy='200' rx='5.5' ry='2.5' fill='%23b8892e' transform='rotate(-20 190 200)'/%3E%3Cellipse cx='230' cy='230' rx='5.5' ry='2.5' fill='%23c4953a' transform='rotate(45 230 230)'/%3E%3C/svg%3E");
    background-size: 240px 240px;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: contrast(1.15) brightness(0.95);
  }

  .l1 { font-size:200px; letter-spacing:12px; display:block; }
  .l2 { font-size:200px; letter-spacing:12px; display:block; margin-top:10px; }

  .tagline {
    position:absolute; bottom:80px; left:0; right:0; text-align:center;
    font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:22px;
    color:#fff; line-height:1.3; z-index:5;
  }
  .tagline em { font-style:italic; color:#1a1714; }

  .grain {
    position:absolute; inset:0; opacity:0.04; mix-blend-mode:overlay; pointer-events:none; z-index:10;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
    background-size:200px;
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="text-block">
    <div class="text-block-inner">
      <span class="l1">STRICT</span>
      <span class="l2">BOEUF</span>
    </div>
  </div>
  <div class="tagline">Le cheat meal <em>qui n'en est pas un</em></div>
  <div class="grain"></div>
</body></html>
