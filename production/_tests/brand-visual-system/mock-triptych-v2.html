<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Space+Grotesk:wght@700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  /* Format panoramique : 3240 x 1350 (3 posts portrait 4:5) */
  body { width:3240px; height:1350px; overflow:hidden; background:#1a1714; position:relative; }

  .bg {
    position:absolute; inset:0; background:#1a1714;
    background-image: radial-gradient(ellipse at 50% 50%, rgba(229,165,32,0.04) 0%, transparent 60%);
  }

  /* Photo continue traversant les 3 posts */
  .photo {
    position:absolute; top:0; left:200px; right:200px; bottom:0;
    background: url('../../../public/images/photos-references/dark-bg/burger-double-boeuf-dark-bg.jpg') center center / cover no-repeat;
    filter: contrast(1.1) saturate(1.15) brightness(0.85);
    opacity:0.6;
  }

  /* Texte panoramique traversant les 3 posts */
  .panoramic-text {
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    z-index:2;
  }
  .panoramic-text-inner {
    font-family:'Oswald', sans-serif; font-weight:700;
    font-size:220px; letter-spacing:20px; text-transform:uppercase;
    color:#E5A520; white-space:nowrap;
    text-align:center;
  }

  /* Lignes de coupe (repères visuels pour le découpage en 3) */
  .cut-line {
    position:absolute; top:0; bottom:0; width:4px;
    background:rgba(255,0,0,0.15); z-index:20;
  }
  .cut-1 { left:1080px; }
  .cut-2 { left:2160px; }

  /* Labels de coupe */
  .cut-label {
    position:absolute; top:20px; z-index:21;
    font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:14px;
    color:rgba(255,0,0,0.3); letter-spacing:2px; text-transform:uppercase;
  }
  .cut-label-1 { left:1090px; }
  .cut-label-2 { left:2170px; }

  /* Tagline en bas du post central */
  .tagline {
    position:absolute; bottom:60px; left:1080px; width:1080px;
    text-align:center; z-index:5;
    font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:22px;
    color:#fff; line-height:1.3;
  }
  .tagline em { font-style:italic; color:#E5A520; }

  .grain {
    position:absolute; inset:0; opacity:0.035; mix-blend-mode:overlay; pointer-events:none; z-index:10;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
    background-size:200px;
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="photo"></div>
  <div class="panoramic-text">
    <div class="panoramic-text-inner">STRICT MAX BOEUF</div>
  </div>

  <!-- Lignes de coupe (1080px et 2160px) -->
  <div class="cut-line cut-1"></div>
  <div class="cut-line cut-2"></div>
  <div class="cut-label cut-label-1">CUT 1</div>
  <div class="cut-label cut-label-2">CUT 2</div>

  <div class="tagline">Le cheat meal <em>qui n'en est pas un</em></div>
  <div class="grain"></div>
</body></html>
