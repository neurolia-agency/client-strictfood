<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<link rel="stylesheet" href="_base/carousel-base.css">
<style>
  body { background: var(--ambre); }

  /* Couverture — Texture Fill SVG sésame */
  .text-block {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    z-index: 2;
  }
  .text-block-inner {
    text-align: center;
    font-family: var(--font-display);
    font-weight: 700;
    text-transform: uppercase;
    line-height: 1.1;
    /* Pattern SVG sésame synthétique (tile 240px, graines ~11x5px) */
    background-image: url("data:image/svg+xml,%3Csvg width='240' height='240' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='240' height='240' fill='%231a1714'/%3E%3Cellipse cx='30' cy='20' rx='5.5' ry='2.5' fill='%23c4953a' transform='rotate(15 30 20)'/%3E%3Cellipse cx='90' cy='45' rx='5.5' ry='2.5' fill='%23d4a43a' transform='rotate(-20 90 45)'/%3E%3Cellipse cx='160' cy='30' rx='5.5' ry='2.5' fill='%23c4953a' transform='rotate(35 160 30)'/%3E%3Cellipse cx='210' cy='60' rx='5.5' ry='2.5' fill='%23b8892e' transform='rotate(-10 210 60)'/%3E%3Cellipse cx='50' cy='80' rx='5.5' ry='2.5' fill='%23d4a43a' transform='rotate(25 50 80)'/%3E%3Cellipse cx='130' cy='90' rx='5.5' ry='2.5' fill='%23c4953a' transform='rotate(-30 130 90)'/%3E%3Cellipse cx='20' cy='130' rx='5.5' ry='2.5' fill='%23b8892e' transform='rotate(40 20 130)'/%3E%3Cellipse cx='100' cy='140' rx='5.5' ry='2.5' fill='%23d4a43a' transform='rotate(-15 100 140)'/%3E%3Cellipse cx='180' cy='120' rx='5.5' ry='2.5' fill='%23c4953a' transform='rotate(20 180 120)'/%3E%3Cellipse cx='60' cy='170' rx='5.5' ry='2.5' fill='%23c4953a' transform='rotate(-25 60 170)'/%3E%3Cellipse cx='140' cy='180' rx='5.5' ry='2.5' fill='%23b8892e' transform='rotate(10 140 180)'/%3E%3Cellipse cx='220' cy='160' rx='5.5' ry='2.5' fill='%23d4a43a' transform='rotate(30 220 160)'/%3E%3Cellipse cx='40' cy='220' rx='5.5' ry='2.5' fill='%23d4a43a' transform='rotate(-35 40 220)'/%3E%3Cellipse cx='110' cy='210' rx='5.5' ry='2.5' fill='%23c4953a' transform='rotate(5 110 210)'/%3E%3Cellipse cx='190' cy='200' rx='5.5' ry='2.5' fill='%23b8892e' transform='rotate(-20 190 200)'/%3E%3Cellipse cx='230' cy='230' rx='5.5' ry='2.5' fill='%23c4953a' transform='rotate(45 230 230)'/%3E%3C/svg%3E");
    background-size: 240px 240px;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: contrast(1.15) brightness(0.95);
  }

  /* Lignes de texte — tailles ajustables */
  .l1 { font-size: {{FONT_SIZE_L1}}px; letter-spacing: {{LETTER_SPACING_L1}}px; display: block; }
  .l2 { font-size: {{FONT_SIZE_L2}}px; letter-spacing: {{LETTER_SPACING_L2}}px; display: block; margin-top: 30px; }
  .l3 { font-size: {{FONT_SIZE_L3}}px; letter-spacing: {{LETTER_SPACING_L3}}px; display: block; margin-top: 30px; }

  .tagline em { color: var(--charbon); }
  .swipe { color: rgba(var(--charbon-rgb), 0.35); }
</style>
</head>
<body>
  <div class="bg-ambre"></div>

  <div class="text-block">
    <div class="text-block-inner">
      <span class="l1">{{LINE_1}}</span>
      <span class="l2">{{LINE_2}}</span>
      <span class="l3">{{LINE_3}}</span>
    </div>
  </div>

  <div class="bottom">
    <div class="tagline">Le cheat meal <em>qui n'en est pas un</em></div>
  </div>
  <div class="swipe">Swipe &rarr;</div>

  <div class="grain" style="opacity: 0.04;"></div>
</body></html>
