<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: {{WIDTH}}px; height: {{HEIGHT}}px;
      overflow: hidden; position: relative; background: #000;
      -webkit-font-smoothing: antialiased;
    }

    .photo { position: absolute; inset: 0; z-index: 1; }
    .photo img { width: 100%; height: 100%; object-fit: cover; object-position: {{OBJECT_POSITION}}; }

    .golden-edge {
      position: absolute; inset: 8px;
      border: 2px solid rgba(250,186,67,0.30);
      border-radius: 4px; z-index: 10; pointer-events: none;
    }

    /* Gradient minimal — juste pour le logo */
    .gradient-bottom {
      position: absolute; bottom: 0; left: 0; right: 0; height: 180px;
      background: linear-gradient(to top, rgba(0,0,0,0.50) 0%, transparent 100%);
      z-index: 5; pointer-events: none;
    }

    .logo-zone {
      position: absolute; bottom: {{LOGO_BOTTOM}}px;
      left: 0; right: 0; text-align: center; z-index: 15;
    }
    .logo-zone img { width: 100px; opacity: 0.30; }

    .grain {
      position: absolute; inset: 0; z-index: 50;
      pointer-events: none; opacity: 0.04; mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
      background-size: 256px;
    }
  </style>
</head>
<body>
  <div class="photo"><img src="{{PHOTO_SRC}}" /></div>
  <div class="golden-edge"></div>
  <div class="gradient-bottom"></div>
  <div class="logo-zone"><img src="{{LOGO_SRC}}" alt="STRICT FOOD'S"></div>
  <div class="grain"></div>
</body>
</html>
