<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: {{WIDTH}}px; height: {{HEIGHT}}px;
      overflow: hidden; position: relative; background: #0a0908;
      -webkit-font-smoothing: antialiased;
    }

    /* Photo en fond, floutée et assombrie */
    .bg-photo {
      position: absolute; inset: -20px; z-index: 0;
      filter: blur({{BG_BLUR}}px);
      opacity: {{BG_OPACITY}};
    }
    .bg-photo img { width: calc(100% + 40px); height: calc(100% + 40px); object-fit: cover; }

    /* Ambre glow subtil */
    .bg-glow {
      position: absolute; inset: 0; z-index: 1;
      background: radial-gradient(ellipse at 50% 50%,
        rgba(250,186,67,0.06) 0%, transparent 60%);
    }

    .golden-edge {
      position: absolute; inset: 8px;
      border: 2px solid rgba(250,186,67,0.18);
      border-radius: 4px; z-index: 10; pointer-events: none;
    }

    /* Texte unique, centré */
    .text-center {
      position: absolute;
      top: {{TEXT_Y}}px;
      left: 80px; right: 80px;
      z-index: 15;
      text-align: center;
    }

    .text-main {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: {{TEXT_SIZE}}px;
      color: rgba(255,255,255,0.90);
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .text-sub {
      margin-top: 12px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 22px;
      color: rgba(255,255,255,0.45);
      letter-spacing: 2px;
    }

    .logo-zone {
      position: absolute; bottom: {{LOGO_BOTTOM}}px;
      left: 0; right: 0; text-align: center; z-index: 15;
    }
    .logo-zone img { width: 110px; opacity: 0.35; }

    .grain {
      position: absolute; inset: 0; z-index: 50;
      pointer-events: none; opacity: 0.04; mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
      background-size: 256px;
    }
  </style>
</head>
<body>
  <div class="bg-photo"><img src="{{PHOTO_SRC}}" /></div>
  <div class="bg-glow"></div>
  <div class="golden-edge"></div>

  <div class="text-center">
    <div class="text-main">{{TEXT_LINE}}</div>
    <div class="text-sub">{{TEXT_SUB}}</div>
  </div>

  <div class="logo-zone"><img src="{{LOGO_SRC}}" alt="STRICT FOOD'S"></div>
  <div class="grain"></div>
</body>
</html>
