<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Oswald:wght@700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: {{WIDTH}}px;
      height: {{HEIGHT}}px;
      overflow: hidden;
      position: relative;
      background: {{BG_COLOR}};
      -webkit-font-smoothing: antialiased;
    }

    /* ===== SUBTLE AMBRE GLOW (centre) ===== */
    .bg-glow {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 35% 50%,
        rgba(250,186,67,0.06) 0%,
        transparent 55%);
      z-index: 0;
    }

    /* ===== GOLDEN EDGE ===== */
    .golden-edge {
      position: absolute;
      inset: 8px;
      border: 2.5px solid rgba(250,186,67,0.25);
      border-radius: 4px;
      z-index: 10;
      pointer-events: none;
    }

    /* ===== TECH FRAME ===== */
    .tech-frame-tl {
      position: absolute;
      top: 50px; left: 35px;
      width: 100px; height: 65px;
      border-top: 1.5px solid rgba(250,186,67,0.20);
      border-left: 1.5px solid rgba(250,186,67,0.20);
      z-index: 5;
    }
    .tech-frame-br {
      position: absolute;
      bottom: 50px; right: 35px;
      width: 100px; height: 65px;
      border-bottom: 1.5px solid rgba(250,186,67,0.15);
      border-right: 1.5px solid rgba(250,186,67,0.15);
      z-index: 5;
    }

    /* ===== CONTENT — centré verticalement ===== */
    .content {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 0 80px;
      z-index: 5;
    }

    /* ===== STATEMENT — Typo massive ===== */
    .statement-text {
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: {{STATEMENT_SIZE}}px;
      color: #FABA43;
      text-transform: uppercase;
      line-height: 0.90;
      letter-spacing: -4px;
      transform: rotate(-0.5deg);
      text-shadow: 0 0 60px rgba(250,186,67,0.15);
    }

    /* ===== SUB-TEXT ===== */
    .sub-text {
      margin-top: 20px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 400;
      font-size: {{SUB_SIZE}}px;
      color: rgba(255,255,255,0.75);
      line-height: 1.4;
      max-width: 700px;
    }
    .sub-text strong {
      color: #FABA43;
      font-weight: 500;
    }

    /* ===== BOTTOM ===== */
    .bottom {
      position: absolute;
      bottom: {{BOTTOM_Y}}px;
      left: 0; right: 0;
      text-align: center;
      z-index: 10;
    }

    .tagline {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: {{TAGLINE_SIZE}}px;
      color: #fff;
    }
    .tagline em { color: #FABA43; font-style: italic; }

    .logo-container {
      margin-top: 14px;
      display: flex;
      justify-content: center;
    }
    .logo-container img { width: 160px; opacity: 0.75; }

    /* ===== TAPE BAND (posts) ===== */
    .tape-band {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 48px; background: #FABA43;
      z-index: 20;
      display: {{TAPE_DISPLAY}};
      align-items: center; overflow: hidden;
    }
    .tape-band-track {
      white-space: nowrap;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700; font-size: 16px;
      letter-spacing: 3px; text-transform: uppercase;
      color: #141210;
    }
    .tape-band-track em { font-style: italic; color: #000; }

    /* ===== EMBER PARTICLES ===== */
    .ember { position: absolute; border-radius: 50%; z-index: 4; }
    .ember-1 { top: 30%; left: 90%; width: 5px; height: 5px; background: #EDBE44; box-shadow: 0 0 10px 4px rgba(237,190,68,0.40); }
    .ember-2 { top: 65%; left: 5%; width: 4px; height: 4px; background: rgba(255,255,255,0.30); box-shadow: 0 0 8px 3px rgba(255,255,255,0.12); }

    /* ===== GRAIN ===== */
    .grain {
      position: absolute; inset: 0; z-index: 50;
      pointer-events: none; opacity: 0.07;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
      background-size: 256px;
    }
  </style>
</head>
<body>

  <div class="bg-glow"></div>
  <div class="golden-edge"></div>
  <div class="tech-frame-tl"></div>
  <div class="tech-frame-br"></div>

  <div class="ember ember-1"></div>
  <div class="ember ember-2"></div>

  <div class="content">
    <div class="statement-text">{{STATEMENT}}</div>
    <div class="sub-text">{{SUB_TEXT}}</div>
  </div>

  <div class="bottom" style="display:{{BOTTOM_DISPLAY}}">
    <div class="tagline">Le cheat meal <em>qui n'en est pas un</em></div>
    <div class="logo-container">
      <img src="{{LOGO_SRC}}" alt="STRICT FOOD'S">
    </div>
  </div>

  <div class="tape-band">
    <div class="tape-band-track">
      LE CHEAT MEAL <em>QUI N'EN EST PAS UN</em> &nbsp;·&nbsp;
      LE CHEAT MEAL <em>QUI N'EN EST PAS UN</em> &nbsp;·&nbsp;
      LE CHEAT MEAL <em>QUI N'EN EST PAS UN</em> &nbsp;·&nbsp;
      LE CHEAT MEAL <em>QUI N'EN EST PAS UN</em> &nbsp;·&nbsp;
    </div>
  </div>

  <div class="grain"></div>

</body>
</html>
