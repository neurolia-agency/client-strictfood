<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: {{WIDTH}}px;
      height: {{HEIGHT}}px;
      overflow: hidden;
      position: relative;
      background: #000;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== IMAGE FULLBLEED ===== */
    .photo {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: {{OBJECT_POSITION}};
    }

    /* ===== GOLDEN BORDER — filet doré sur les bords du canvas ===== */
    .golden-edge {
      position: absolute;
      inset: 8px;
      border: 2.5px solid rgba(250,186,67,0.40);
      border-radius: 4px;
      z-index: 10;
      pointer-events: none;
    }

    /* ===== GRADIENT BAS (pour logo) ===== */
    .gradient-bottom {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 250px;
      background: linear-gradient(to top,
        rgba(0,0,0,0.65) 0%,
        rgba(0,0,0,0.25) 50%,
        transparent 100%);
      z-index: 5;
      pointer-events: none;
    }

    /* ===== LOGO GHOST ===== */
    .logo-zone {
      position: absolute;
      bottom: {{LOGO_BOTTOM}}px;
      left: 0; right: 0;
      text-align: center;
      z-index: 15;
    }

    .logo-zone img {
      width: 110px;
      opacity: 0.35;
    }

    /* ===== TEXT MINIMAL (optionnel, 1 ligne max) ===== */
    .text-line {
      position: absolute;
      bottom: {{TEXT_BOTTOM}}px;
      left: 80px; right: 80px;
      z-index: 15;
      display: {{TEXT_DISPLAY}};
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 24px;
      color: rgba(255,255,255,0.70);
      text-align: center;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* ===== GRAIN ===== */
    .grain {
      position: absolute; inset: 0; z-index: 50;
      pointer-events: none; opacity: 0.04;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
      background-size: 256px;
    }
  </style>
</head>
<body>

  <!-- IMAGE -->
  <div class="photo">
    <img src="{{PHOTO_SRC}}" />
  </div>

  <!-- GOLDEN EDGE -->
  <div class="golden-edge"></div>

  <!-- GRADIENT -->
  <div class="gradient-bottom"></div>

  <!-- LOGO -->
  <div class="logo-zone">
    <img src="{{LOGO_SRC}}" alt="STRICT FOOD'S">
  </div>

  <!-- TEXT (optional) -->
  <div class="text-line">{{TEXT_LINE}}</div>

  <!-- GRAIN -->
  <div class="grain"></div>

</body>
</html>
