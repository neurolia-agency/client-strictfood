<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: {{WIDTH}}px; height: {{HEIGHT}}px;
      overflow: hidden; position: relative; background: #000;
      -webkit-font-smoothing: antialiased;
    }

    .photo { position: absolute; inset: 0; z-index: 1; }
    .photo img { width: 100%; height: 100%; object-fit: cover; object-position: {{OBJECT_POSITION}}; }

    .golden-edge {
      position: absolute; inset: 8px;
      border: 2.5px solid rgba(250,186,67,0.35);
      border-radius: 4px; z-index: 10; pointer-events: none;
    }

    /* Gradient bas plus prononcé (texte lisible) */
    .gradient-bottom {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: {{GRADIENT_HEIGHT}}px;
      background: linear-gradient(to top,
        rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.35) 45%, transparent 100%);
      z-index: 5; pointer-events: none;
    }

    /* Ligne de texte optionnelle */
    .text-line {
      position: absolute; bottom: {{TEXT_BOTTOM}}px;
      left: 80px; right: 80px; z-index: 15;
      display: {{TEXT_DISPLAY}};
      font-family: 'DM Sans', sans-serif;
      font-weight: 500; font-size: 30px;
      color: rgba(255,255,255,0.90);
      text-align: center; line-height: 1.4;
    }
    .text-line strong { color: #FABA43; font-weight: 700; }

    .logo-zone {
      position: absolute; bottom: {{LOGO_BOTTOM}}px;
      left: 0; right: 0; text-align: center; z-index: 15;
    }
    .logo-zone img { width: 120px; opacity: 0.50; }

    .grain {
      position: absolute; inset: 0; z-index: 50;
      pointer-events: none; opacity: 0.05; mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
      background-size: 256px;
    }
  </style>
</head>
<body>
  <div class="photo"><img src="{{PHOTO_SRC}}" /></div>
  <div class="golden-edge"></div>
  <div class="gradient-bottom"></div>
  <div class="text-line">{{TEXT_LINE}}</div>
  <div class="logo-zone"><img src="{{LOGO_SRC}}" alt="STRICT FOOD'S"></div>
  <div class="grain"></div>
</body>
</html>
