<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a2520"/>
      <stop offset="100%" stop-color="#1f1b17"/>
    </radialGradient>
  </defs>

  <!-- Fond charbon -->
  <circle cx="540" cy="540" r="540" fill="url(#bg-grad)"/>

  <!-- Burger silhouette profil — cuivre braisé -->
  <g transform="translate(540, 540) scale(1)" fill="#c4873a" stroke="none">
    <!-- Bun top (dôme) -->
    <path d="M-160,-80 Q-160,-170 0,-170 Q160,-170 160,-80 Q160,-60 140,-50 L-140,-50 Q-160,-60 -160,-80 Z"/>
    <!-- Graines sésame sur le bun -->
    <ellipse cx="-60" cy="-130" rx="8" ry="5" transform="rotate(-20,-60,-130)" fill="#1f1b17" opacity="0.4"/>
    <ellipse cx="20" cy="-145" rx="8" ry="5" transform="rotate(15,20,-145)" fill="#1f1b17" opacity="0.4"/>
    <ellipse cx="80" cy="-120" rx="8" ry="5" transform="rotate(-10,80,-120)" fill="#1f1b17" opacity="0.4"/>
    <ellipse cx="-100" cy="-110" rx="7" ry="4" transform="rotate(25,-100,-110)" fill="#1f1b17" opacity="0.4"/>
    <ellipse cx="120" cy="-100" rx="7" ry="4" transform="rotate(-30,120,-100)" fill="#1f1b17" opacity="0.4"/>
    <!-- Salade qui dépasse -->
    <path d="M-155,-48 Q-145,-65 -120,-48 Q-100,-62 -80,-46 Q-60,-60 -40,-44 Q-20,-58 0,-42 Q20,-56 40,-44 Q60,-58 80,-46 Q100,-60 120,-48 Q140,-62 155,-46 L155,-38 L-155,-38 Z" fill="#c4873a" opacity="0.7"/>
    <!-- Steak (layer épais) -->
    <rect x="-150" y="-36" width="300" height="50" rx="8" fill="#c4873a"/>
    <!-- Fromage qui dépasse -->
    <path d="M-155,-36 L-155,-26 Q-140,-18 -150,-8 L-160,2 Q-155,6 -148,2 L-140,-6 L155,-6 L155,-36 Z" fill="#c4873a" opacity="0.6"/>
    <path d="M155,-36 L155,-26 Q140,-18 150,-8 L160,2 Q155,6 148,2 L140,-6 Z" fill="#c4873a" opacity="0.6"/>
    <!-- Tomate / garniture -->
    <rect x="-148" y="0" width="296" height="25" rx="6" fill="#c4873a" opacity="0.5"/>
    <!-- Bun bottom -->
    <path d="M-150,30 L150,30 Q160,35 160,55 Q160,80 140,85 L-140,85 Q-160,80 -160,55 Q-160,35 -150,30 Z"/>
  </g>
</svg>