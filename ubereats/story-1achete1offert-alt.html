<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Oswald:wght@500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== FOND CHARBON ===== */
    .bg-charbon {
      position: absolute; inset: 0; z-index: 0;
      background-color: #1a1714;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% 55%,
          rgba(250,186,67,0.10) 0%, transparent 60%);
    }

    /* ===== PHOTO PLEIN CADRE ===== */
    .product-fullwidth {
      position: absolute;
      top: 580px; left: 0; right: 0;
      height: 820px;
      z-index: 6;
      overflow: hidden;
    }
    .product-fullwidth img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center 45%;
    }
    /* Fondu haut et bas vers le charbon */
    .product-fullwidth::before { display: none; }
    .product-fullwidth::after { display: none; }

    /* ===== GRAPHIC ELEMENTS — repositionnes ===== */
    .gfx-bar {
      position: absolute;
      top: 1550px; left: -100px;
      width: 1400px; height: 40px;
      background: linear-gradient(90deg,
        rgba(250,186,67,0.25) 0%, rgba(237,190,68,0.12) 50%,
        transparent 100%);
      transform: rotate(-15deg);
      z-index: 7; pointer-events: none;
    }

    .gfx-line { position: absolute; z-index: 7; pointer-events: none; }
    .gfx-line-1 {
      top: 580px; left: -50px; width: 1200px; height: 1.5px;
      background: linear-gradient(90deg, transparent, rgba(237,190,68,0.12) 30%, rgba(237,190,68,0.04) 70%, transparent);
      transform: rotate(-2deg);
    }
    .gfx-line-2 {
      top: 1480px; right: -50px; width: 800px; height: 1.5px;
      background: linear-gradient(90deg, transparent, rgba(237,190,68,0.10) 40%, transparent);
      transform: rotate(3deg);
    }

    .tech-tl {
      position: absolute; top: 50px; right: 35px;
      width: 90px; height: 60px;
      border-top: 1.5px solid rgba(250,186,67,0.18);
      border-right: 1.5px solid rgba(250,186,67,0.18);
      z-index: 12;
    }
    .tech-br {
      position: absolute; bottom: 50px; left: 35px;
      width: 90px; height: 60px;
      border-bottom: 1.5px solid rgba(250,186,67,0.12);
      border-left: 1.5px solid rgba(250,186,67,0.12);
      z-index: 12;
    }

    .gfx-circle {
      position: absolute; border-radius: 50%;
      border: 1.5px solid rgba(237,190,68,0.07);
      z-index: 7; pointer-events: none;
    }
    .gfx-circle-1 { top: 320px; right: 50px; width: 130px; height: 130px; }
    .gfx-circle-2 { top: 1580px; right: 120px; width: 55px; height: 55px; }

    .gfx-dots { position: absolute; z-index: 7; pointer-events: none; display: flex; flex-direction: column; gap: 10px; }
    .gfx-dots .row { display: flex; gap: 10px; }
    .gfx-dots .dot { width: 4px; height: 4px; border-radius: 50%; background: rgba(237,190,68,0.12); }
    .gfx-dots-1 { top: 540px; left: 50px; }

    .ember { position: absolute; border-radius: 50%; z-index: 8; }
    .ember-1 { top: 380px; right: 60px; width: 5px; height: 5px; background: #EDBE44; box-shadow: 0 0 10px 4px rgba(237,190,68,0.35); }
    .ember-2 { top: 1520px; left: 80px; width: 4px; height: 4px; background: #EDBE44; box-shadow: 0 0 8px 3px rgba(237,190,68,0.30); }
    .ember-3 { top: 1650px; right: 45px; width: 3px; height: 3px; background: rgba(255,255,255,0.20); box-shadow: 0 0 6px 2px rgba(255,255,255,0.08); }

    .brand-burger-xl {
      position: absolute; right: -70px; top: 60px;
      width: 400px; height: 400px; opacity: 0.03;
      transform: rotate(15deg); z-index: 7; pointer-events: none;
    }

    .filet {
      position: absolute; inset: 10px;
      border: 2px solid rgba(250,186,67,0.12);
      border-radius: 4px; z-index: 12; pointer-events: none;
    }

    /* ===== UBER EATS BADGE ===== */
    .uber-badge {
      position: absolute;
      top: 280px; left: 50%;
      transform: translateX(-50%);
      z-index: 12;
      display: flex; align-items: center; gap: 6px;
      padding: 14px 28px;
      background: rgba(255,255,255,0.08);
      border: 1.5px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      backdrop-filter: blur(8px);
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700; font-size: 36px;
    }
    .uber-badge .uber { color: #fff; }
    .uber-badge .eats { color: #3FC060; }

    /* ===== OFFRE TITRE ===== */
    .offre-title {
      position: absolute;
      top: 420px; left: 80px; right: 80px;
      z-index: 12;
      font-family: 'Oswald', sans-serif; font-weight: 700;
      font-size: 110px;
      text-transform: uppercase; line-height: 1;
      letter-spacing: -2px;
      text-align: center;
    }
    .offre-title .gold { color: #FABA43; }
    .offre-title .white { color: #fff; }

    /* ===== DETAILS OFFRE ===== */
    .offre-details {
      position: absolute;
      top: 1455px; left: 80px; right: 80px;
      z-index: 12;
    }
    .offre-desc {
      font-family: 'DM Sans', sans-serif; font-size: 34px;
      font-weight: 500; color: #fff;
      line-height: 1.4;
    }
    .offre-desc strong { color: #FABA43; font-weight: 700; }

    .offre-cta {
      margin-top: 24px;
      display: inline-block;
      font-family: 'Space Grotesk', sans-serif; font-weight: 700;
      font-size: 24px; color: #1a1714;
      text-transform: uppercase; letter-spacing: 4px;
      padding: 14px 40px;
      background: #FABA43;
      border-radius: 8px;
    }

    /* ===== BOTTOM ===== */
    .story-bottom {
      position: absolute; bottom: 0; left: 0; right: 0;
      z-index: 12; text-align: center;
      padding: 0 70px 80px;
    }
    .story-bottom .tagline {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700; font-size: 34px; color: #fff;
    }
    .story-bottom .tagline em { color: #FABA43; font-style: italic; }
    .story-bottom .logo-container { margin-top: 14px; display: flex; justify-content: center; }
    .story-bottom .logo-container img { width: 380px; height: auto; opacity: 0.82; }

    /* ===== GRAIN ===== */
    .grain {
      position: absolute; inset: 0; z-index: 50;
      pointer-events: none; opacity: 0.06; mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
      background-size: 256px;
    }
  </style>
</head>
<body>

  <div class="bg-charbon"></div>
  <div class="filet"></div>

  <!-- GRAPHIC ELEMENTS — repositionnes pour variete -->
  <div class="gfx-bar"></div>
  <div class="gfx-line gfx-line-1"></div>
  <div class="gfx-line gfx-line-2"></div>
  <div class="tech-tl"></div>
  <div class="tech-br"></div>
  <div class="gfx-circle gfx-circle-1"></div>
  <div class="gfx-circle gfx-circle-2"></div>
  <div class="gfx-dots gfx-dots-1">
    <div class="row"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    <div class="row"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    <div class="row"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  </div>
  <div class="ember ember-1"></div>
  <div class="ember ember-2"></div>
  <div class="ember ember-3"></div>

  <svg class="brand-burger-xl" viewBox="295 -2 62 57" fill="#EDBE44">
    <path d="M301.14,27.2s23.15-7.06,48.17-6.88c9.57.07-2.47-22.65-27.13-20.12-.26.03-.53.07-.79.12-22.86,4.79-23.62,19.86-23.62,19.86,0,0-2.25,8.21,3.37,7.02Z"/>
    <path d="M328.32,35.59c-17.57,3.75-2-2.84,15.01-3.21,8.42-.18,6.69-3.05-2.32-2.69-47.3,1.94.58-3.37,9.16-4.11,1.12-.1,2.05-2.69-1.21-2.84,0,0-29.98-.18-45.5,8-17.38,9.16,19.68.42,21.33,1.58,0,0-13.48,2.74-20.26,6.71-5.93,3.47,30.72-3.81,49.17-2.81,9,.49-3.71-5.25-25.38-.63Z"/>
    <path d="M301.55,49.28c5.53,3.9,42.86,7.27,51.08-6.11,4.37-10.48-60.87-1.63-51.08,6.11Z"/>
  </svg>

  <!-- UBER EATS BADGE -->
  <div class="uber-badge">
    <span class="uber">Uber</span><span class="eats">Eats</span>
  </div>

  <!-- OFFRE TITRE -->
  <div class="offre-title">
    <span class="gold">1 ACHETÉ</span> <span class="white">=</span> <span class="gold">1 OFFERT</span>
  </div>

  <!-- PHOTO PLEIN CADRE -->
  <div class="product-fullwidth">
    <img src="file:///Users/dorian.gz/Downloads/ChatGPT%20Image%2011%20avr.%202026,%2013_22_31.png" />
  </div>

  <!-- DETAILS -->
  <div class="offre-details">
    <div class="offre-desc">Peu importe le produit, <strong>le 2e est offert</strong>.<br>Valable sur Uber Eats.</div>
    <div class="offre-cta">Commander maintenant</div>
  </div>

  <!-- BOTTOM -->
  <div class="story-bottom">
    <div class="tagline">Le cheat meal <em>qui n'en est pas un</em></div>
    <div class="logo-container">
      <img src="file:///Users/dorian.gz/dev/Neurolia%20Agency/client-strictfood/production/posts-stories/stories/_templates/_base/logo.svg" alt="STRICT FOOD'S">
    </div>
  </div>

  <div class="grain"></div>

</body>
</html>
